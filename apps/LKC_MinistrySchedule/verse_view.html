<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <script type="module" src="../../firebase/observability-browser.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>經文閱讀器</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@400;600;700;900&display=swap">
  <style>
    /* Premium CSS Variables & Styling */
    :root {
      --lkc-green: #059669;
      --lkc-green-hover: #047857;
      --lkc-green-light: rgba(5, 150, 105, 0.08);
      --lkc-green-glow: rgba(5, 150, 105, 0.15);
      
      --bg-gradient: radial-gradient(circle at top left, #f0fdf4 0%, #f8fafc 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.6);
      --card-shadow: rgba(0, 96, 48, 0.04);
      
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-light: #64748b;
      
      --tab-bg: #e2e8f0;
      --tab-active-bg: #ffffff;
      --tab-text: #475569;
      
      --border-color: rgba(15, 23, 42, 0.08);
      --toggle-bg: #f1f5f9;
      --toggle-btn-bg: #ffffff;
    }

    [data-theme="dark"] {
      --lkc-green: #10b981;
      --lkc-green-hover: #34d399;
      --lkc-green-light: rgba(16, 185, 129, 0.1);
      --lkc-green-glow: rgba(16, 185, 129, 0.25);
      
      --bg-gradient: radial-gradient(circle at top right, #062f1d 0%, #0b0f19 100%);
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.05);
      --card-shadow: rgba(0, 0, 0, 0.3);
      
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --text-light: #94a3b8;
      
      --tab-bg: #1e293b;
      --tab-active-bg: #0f172a;
      --tab-text: #94a3b8;
      
      --border-color: rgba(255, 255, 255, 0.08);
      --toggle-bg: #0f172a;
      --toggle-btn-bg: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background: var(--bg-gradient);
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Top Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      font-size: 1.8rem;
    }

    .title-area h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .title-area p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Theme Switcher */
    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px var(--card-shadow);
      transition: all 0.2s;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.08);
      border-color: var(--lkc-green);
    }

    /* Scripture Tabs */
    .tabs-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      width: 100%;
      scrollbar-width: thin;
    }

    .tabs-container::-webkit-scrollbar {
      height: 4px;
    }

    .tabs-container::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 100px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px var(--card-shadow);
    }

    .tab-btn:hover {
      border-color: var(--lkc-green);
      color: var(--lkc-green);
    }

    .tab-btn.active {
      background: var(--lkc-green);
      border-color: var(--lkc-green);
      color: #ffffff !important;
      box-shadow: 0 8px 16px var(--lkc-green-glow);
    }

    /* Controls Bar */
    .controls-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 24px var(--card-shadow);
    }

    /* Segmented Switch for Language */
    .lang-toggle {
      display: flex;
      background: var(--toggle-bg);
      padding: 3px;
      border-radius: 100px;
      border: 1px solid var(--border-color);
      position: relative;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 18px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 100px;
      z-index: 1;
      transition: color 0.2s;
    }

    .lang-btn.active {
      color: var(--text-main);
      background: var(--toggle-btn-bg);
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
    }

    /* Version Selection Pills */
    .versions-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .version-pill {
      background: var(--toggle-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .version-pill:hover {
      border-color: var(--lkc-green);
      color: var(--lkc-green);
    }

    .version-pill.active {
      background: var(--lkc-green-light);
      border-color: var(--lkc-green);
      color: var(--lkc-green);
      font-weight: 700;
    }

    /* Main Scripture Display Card */
    .reader-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      min-height: 250px;
      box-shadow: 0 16px 36px var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
    }

    .reader-header {
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .reader-title-label {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text-main);
      font-family: 'Noto Sans TC', sans-serif;
    }

    .reader-version-label {
      font-size: 0.88rem;
      color: var(--lkc-green);
      font-weight: 700;
      background: var(--lkc-green-light);
      padding: 4px 12px;
      border-radius: 20px;
    }

    .reader-content {
      font-family: 'Noto Serif TC', Georgia, serif;
      font-size: 1.35rem;
      line-height: 1.95;
      color: var(--text-main);
      text-align: justify;
    }

    /* Verse Layout styles */
    .verse-row {
      margin-bottom: 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .verse-num {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--lkc-green);
      background: var(--lkc-green-light);
      padding: 2px 6px;
      border-radius: 6px;
      margin-top: 4px;
      line-height: 1.1;
      min-width: 24px;
      text-align: center;
    }

    .verse-text {
      flex: 1;
    }

    /* Loading Spinner */
    .spinner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--card-bg);
      border-radius: 24px;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--lkc-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Copy/Actions Panel */
    .actions-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    .btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 100px;
      padding: 8px 18px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--toggle-btn-bg);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 4px var(--card-shadow);
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: var(--lkc-green);
      color: var(--lkc-green);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--lkc-green);
      border-color: var(--lkc-green);
      color: #ffffff;
      box-shadow: 0 4px 10px var(--lkc-green-glow);
    }

    .btn-primary:hover {
      background: var(--lkc-green-hover);
      border-color: var(--lkc-green-hover);
      color: #ffffff;
    }

    /* Form fallback if no query string */
    .search-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 24px var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-panel h3 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .input-field {
      flex: 1;
      padding: 12px 20px;
      border-radius: 100px;
      border: 1.5px solid var(--border-color);
      font-size: 0.95rem;
      outline: none;
      background: var(--toggle-btn-bg);
      color: var(--text-main);
      font-family: inherit;
      transition: all 0.25s;
    }

    .input-field:focus {
      border-color: var(--lkc-green);
      box-shadow: 0 0 0 3px var(--lkc-green-light);
    }

    .helper-text {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-left: 16px;
    }

    .alert {
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      display: none;
    }

    .alert-danger {
      background: rgba(220, 38, 38, 0.08);
      border: 1px solid rgba(220, 38, 38, 0.2);
      color: #dc2626;
    }

    /* Toast message */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.9);
      color: white;
      padding: 10px 24px;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* RWD Adjustment */
    @media (max-width: 600px) {
      body {
        padding: 20px 10px;
      }
      
      .reader-card {
        padding: 24px;
      }

      .reader-title-label {
        font-size: 1.3rem;
      }

      .controls-card {
        flex-direction: column;
        align-items: stretch;
      }

      .lang-toggle {
        justify-content: center;
      }

      .versions-list {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  
  <div class="container">
    
    <!-- Top Header -->
    <header>
      <div class="logo-area">
        <span class="logo-icon">🌿</span>
        <div class="title-area">
          <h1>經文閱讀器</h1>
          <p>聚會經文線上速讀與多語版研讀</p>
        </div>
      </div>
      
      <button class="theme-toggle-btn" id="theme-toggle" title="切換深淺色模式">🌓</button>
    </header>

    <!-- Fallback Search Panel (Visible if no parameters or custom search) -->
    <div class="search-panel" id="search-panel" style="display: none;">
      <h3>📖 請輸入經文範圍</h3>
      <div class="search-row">
        <input type="text" class="input-field" id="search-input" placeholder="例如：詩篇37:25-26；以賽亞書32:17-18">
        <button class="btn btn-primary" id="search-btn">查詢經文</button>
      </div>
      <div class="helper-text">支援格式：以弗所書5:1-4、創1:1-3; 4:1-6，多個範圍以分號「；」隔開</div>
    </div>

    <!-- Alert for Errors -->
    <div class="alert alert-danger" id="error-alert"></div>

    <!-- Tab Bar for Scripture Segments -->
    <div class="tabs-container" id="tabs-container">
      <!-- Tabs will be rendered here dynamically -->
    </div>

    <!-- Language and Version Controls -->
    <div class="controls-card" id="controls-card" style="display: none;">
      <!-- Language toggle -->
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="tw">台語</button>
        <button class="lang-btn" data-lang="zh">華語</button>
      </div>
      
      <!-- Version pills -->
      <div class="versions-list" id="versions-list">
        <!-- Versions will be populated here -->
      </div>
    </div>

    <!-- Scripture Reading Card -->
    <div class="reader-card" id="reader-card" style="display: none;">
      <!-- Loading Spinner Overlay -->
      <div class="spinner-overlay" id="loading-overlay">
        <div class="spinner"></div>
      </div>

      <div class="reader-header">
        <div class="reader-title-label" id="reader-title">載入中...</div>
        <div class="reader-version-label" id="reader-version">...</div>
      </div>

      <div class="reader-content" id="reader-content">
        <!-- Scripture texts will be here -->
      </div>

      <!-- Actions (Copy, Share) -->
      <div class="actions-bar">
        <button class="btn" id="copy-btn">📋 複製文字</button>
        <button class="btn" id="share-btn">🔗 分享連結</button>
      </div>
    </div>

  </div>

  <!-- Toast popup -->
  <div class="toast" id="toast-message">複製成功！</div>

  <script src="../LKC_ppt_generator/bible-service.js"></script>
  <script>
    const BIBLE_BOOKS = FhlBibleService.BIBLE_BOOKS;
    const parseQuery = FhlBibleService.parseQuery;

    // Supported versions definition
    const VERSION_MAPPING = {
      tw: [
        { code: 'tghg', name: '巴克禮台漢本 (tghg)' },
        { code: 'ttvhl2021', name: '現代台語2021漢字版 (ttvhl2021)' }
      ],
      zh: [
        { code: 'unv_god', name: '和合本上帝版 (unv_god)' },
        { code: 'unv', name: '和合本神版 (unv)' }
      ]
    };

    // State Variables
    let parsedQueries = [];
    let currentSegmentIndex = 0;
    let currentLanguage = 'tw';
    let currentVersion = 'tghg';
    let activeData = null;

    // Dom Elements
    const searchPanel = document.getElementById('search-panel');
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const errorAlert = document.getElementById('error-alert');
    const tabsContainer = document.getElementById('tabs-container');
    const controlsCard = document.getElementById('controls-card');
    const versionsList = document.getElementById('versions-list');
    const readerCard = document.getElementById('reader-card');
    const readerTitle = document.getElementById('reader-title');
    const readerVersion = document.getElementById('reader-version');
    const readerContent = document.getElementById('reader-content');
    const loadingOverlay = document.getElementById('loading-overlay');
    const copyBtn = document.getElementById('copy-btn');
    const shareBtn = document.getElementById('share-btn');
    const toast = document.getElementById('toast-message');

    // -------------------------------------------------------------
    // Initialization
    // -------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Dark Mode initialization
      const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', savedTheme);
      
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
      });

      // 2. Language Switch event listeners
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const lang = e.target.dataset.lang;
          if (lang === currentLanguage) return;

          document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');

          currentLanguage = lang;
          // Set default version for the selected language
          currentVersion = VERSION_MAPPING[lang][0].code;
          
          renderVersionSelector();
          fetchActiveScripture();
        });
      });

      // 3. Fallback Search button click
      searchBtn.addEventListener('click', handleManualSearch);
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleManualSearch();
      });

      // 4. Action Buttons
      copyBtn.addEventListener('click', copyTextToClipboard);
      shareBtn.addEventListener('click', copyShareLink);

      // 5. Parse initial query string from URL
      initFromUrl();
    });

    function initFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const queryVal = params.get('q');
      
      if (queryVal) {
        processQuery(queryVal);
      } else {
        // Show fallback search if no query parameter
        searchPanel.style.display = 'block';
      }
    }

    function handleManualSearch() {
      const val = searchInput.value.trim();
      if (!val) return;
      
      // Update URL without reloading to support sharing
      const newUrl = `${window.location.pathname}?q=${encodeURIComponent(val)}`;
      window.history.pushState({ path: newUrl }, '', newUrl);

      processQuery(val);
    }

    function processQuery(queryString) {
      errorAlert.style.display = 'none';
      parsedQueries = parseQuery(queryString);

      if (parsedQueries.length === 0) {
        showError('無法識別經文格式。請輸入如：「以賽亞書32:17-18；提摩太後書3:16」');
        return;
      }

      // Hide search panel, show reading workspace
      searchPanel.style.display = 'none';
      controlsCard.style.display = 'flex';
      readerCard.style.display = 'flex';

      currentSegmentIndex = 0;
      
      renderTabs();
      renderVersionSelector();
      fetchActiveScripture();
    }

    // -------------------------------------------------------------


    // -------------------------------------------------------------
    // UI Rendering
    // -------------------------------------------------------------
    function renderTabs() {
      tabsContainer.innerHTML = '';
      
      // If only one segment, we can still show it or hide the bar. Showing is helpful for context.
      parsedQueries.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${idx === currentSegmentIndex ? 'active' : ''}`;
        btn.innerHTML = `📖 ${q.bookName} ${q.chap}${q.sec ? ':' + q.sec : ' 章'}`;
        btn.addEventListener('click', () => {
          if (idx === currentSegmentIndex) return;
          
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          
          currentSegmentIndex = idx;
          fetchActiveScripture();
        });
        tabsContainer.appendChild(btn);
      });
    }

    // Dynamic version switcher rendering
    function renderVersionSelector() {
      versionsList.innerHTML = '';
      const versionOpts = VERSION_MAPPING[currentLanguage];
      
      versionOpts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = `version-pill ${opt.code === currentVersion ? 'active' : ''}`;
        btn.innerText = opt.name;
        btn.addEventListener('click', () => {
          if (opt.code === currentVersion) return;
          
          document.querySelectorAll('.version-pill').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          
          currentVersion = opt.code;
          fetchActiveScripture();
        });
        versionsList.appendChild(btn);
      });
    }

    function showError(msg) {
      errorAlert.innerText = msg;
      errorAlert.style.display = 'block';
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // -------------------------------------------------------------
    // API Fetch and Presentation
    // -------------------------------------------------------------
    async function fetchActiveScripture() {
      if (parsedQueries.length === 0 || currentSegmentIndex >= parsedQueries.length) return;
      
      const queryObj = parsedQueries[currentSegmentIndex];
      const qstr = `${queryObj.bookName} ${queryObj.chap}${queryObj.sec ? ':' + queryObj.sec : ''}`;
      
      loadingOverlay.style.display = 'flex';
      errorAlert.style.display = 'none';

      try {
        const res = await FhlBibleService.fetchScripture(queryObj, currentVersion);
        activeData = res.record.map(v => ({
          ...v,
          bible_text: v.bible_text.replace(/<\/?[a-zA-Z0-9]+[^>]*>/g, '')
        }));
        renderActiveScripture(queryObj);
      } catch (err) {
        console.error('Fetch error:', err);
        showError(`讀取經文失敗（${qstr}）：${err.message}`);
        readerContent.innerHTML = `<p style="color: var(--text-light); text-align: center; margin-top: 40px;">⚠️ 無法載入經文內容</p>`;
      } finally {
        loadingOverlay.style.display = 'none';
      }
    }

    function renderActiveScripture(queryObj) {
      if (!activeData) return;

      const activeVerName = document.querySelector(`.version-pill.active`).innerText;
      readerTitle.innerText = `${queryObj.bookName} ${queryObj.chap}${queryObj.sec ? ':' + queryObj.sec : ' 章'}`;
      readerVersion.innerText = activeVerName;

      const versesHtml = activeData.map(verse => `
        <div class="verse-row">
          <span class="verse-num">${verse.sec}</span>
          <span class="verse-text">${verse.bible_text}</span>
        </div>
      `).join('');

      readerContent.innerHTML = versesHtml;
    }

    // -------------------------------------------------------------
    // Helper actions: Copy and Share
    // -------------------------------------------------------------
    function getFormattedScriptureText() {
      if (!activeData || parsedQueries.length === 0) return '';
      const queryObj = parsedQueries[currentSegmentIndex];
      const activeVerName = document.querySelector(`.version-pill.active`).innerText;
      
      let header = `📖 ${queryObj.bookName} ${queryObj.chap}${queryObj.sec ? ':' + queryObj.sec : ' 章'} (${activeVerName})\n`;
      let content = activeData.map(verse => `[${verse.sec}] ${verse.bible_text.trim()}`).join('\n');
      
      return `${header}${content}`;
    }

    function copyTextToClipboard() {
      const text = getFormattedScriptureText();
      if (!text) return;

      navigator.clipboard.writeText(text).then(() => {
        showToast('📋 經文已成功複製到剪貼簿！');
      }).catch(err => {
        console.error('Copy failed:', err);
        showToast('❌ 複製失敗，請手動圈選文字複製。');
      });
    }

    function copyShareLink() {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        showToast('🔗 分享連結已成功複製！');
      }).catch(err => {
        console.error('Copy link failed:', err);
        showToast('❌ 連結複製失敗。');
      });
    }
  </script>
</body>
</html>
