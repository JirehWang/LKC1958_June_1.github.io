<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>window._GAS_KEY = 'LKC_MinistrySchedule_TEST';</script>
    <script src="../../config.js?v=20260906_v2_gatheringonly"></script>
    <!-- ⚡ Supabase 本地熱響應服務 (<50ms) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase/supabase-config.js?v=20260906_v2_gatheringonly"></script>
    <script src="ministry-supabase.js?v=20260906_v2_gatheringonly"></script>
    <style>
        /* 佈告欄專屬的 CSS 風格 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7fafc;
            color: #2d3748;
            margin: 0;
            padding: 20px;
        }
        .board-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: #2b6cb0;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            color: #718096;
            font-size: 1.1em;
        }
        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        .event-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border-top: 5px solid #48bb78; /* 小組用綠色系區分 */
        }
        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }
        .date-badge {
            background: #f0fff4;
            color: #2f855a;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }
        .date-badge .day {
            font-size: 2em;
            font-weight: bold;
            line-height: 1;
        }
        .date-badge .ym {
            font-size: 0.9em;
            color: #4a5568;
            margin-top: 5px;
        }
        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .btn-copy-card {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f8fafc;
            color: #475569;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 3px 9px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .btn-copy-card svg {
            transition: transform 0.2s;
        }
        .btn-copy-card:hover {
            background: #2f855a;
            color: #ffffff;
            border-color: #2f855a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(47, 133, 90, 0.2);
        }
        .btn-copy-card:active {
            transform: scale(0.96);
        }
        .btn-copy-card.copied {
            background: #38a169 !important;
            color: #ffffff !important;
            border-color: #38a169 !important;
            box-shadow: 0 4px 12px rgba(56, 161, 105, 0.25) !important;
        }
        .card-body {
            padding: 20px;
        }
        .group-tag {
            display: inline-block;
            background: #f0fff4;
            color: #2f855a;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        /* 團契類型用不同色塊區隔 */
        .group-tag.fellowship {
            background: #fff5f0;
            color: #c2410c;
        }
        .event-name {
            font-size: 1.25em;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 15px;
            text-align: center;
        }
        .duty-section {
            background: #f9fafb;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #48bb78;
        }
        .info-row {
            margin-bottom: 6px;
            font-size: 0.95em;
            line-height: 1.4;
            display: flex;
            justify-content: space-between;
        }
        .info-label {
            color: #718096;
            font-weight: bold;
            margin-right: 5px;
        }
        .info-value {
            color: #2d3748;
            font-weight: 500;
        }
        .no-data {
            text-align: center;
            color: #a0aec0;
            font-size: 1.2em;
            padding: 50px;
            grid-column: 1 / -1;
        }
        .admin-link {
            display: block;
            text-align: center;
            margin-top: 40px;
            color: #718096;
            text-decoration: none;
            font-size: 0.9em;
        }
        .admin-link:hover { color: #2b6cb0; text-decoration: underline; }
        .verse-link {
            color: #2b6cb0;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px dashed #2b6cb0;
            transition: all 0.2s ease;
        }
        .verse-link:hover {
            color: #1a365d;
            border-bottom-style: solid;
        }
        
        .spinner {
            margin: 100px auto;
            width: 50px;
            height: 40px;
            text-align: center;
            font-size: 10px;
        }
        .spinner > div {
            background-color: #48bb78;
            height: 100%;
            width: 6px;
            display: inline-block;
            animation: sk-stretchdelay 1.2s infinite ease-in-out;
        }
        @keyframes sk-stretchdelay {
            0%, 40%, 100% { transform: scaleY(0.4); }  
            20% { transform: scaleY(1.0); }
        }
    </style>
</head>
<body>

    <div class="board-container">
        <div class="header">
            <h1>🌿 小組團契近期聚會佈告欄</h1>
            <p id="dateRangeText"> 願你們平安，在小組團契裡常存愛的陪伴❤️❤️❤️<br><small>同步小組最新資料中...</small></p>
        </div>

        <div id="boardGrid" class="event-grid">
            <div class="spinner">
                <div class="rect1"></div><div class="rect2"></div><div class="rect3"></div><div class="rect4"></div><div class="rect5"></div>
            </div>
        </div>

        <a href="index.html" class="admin-link">⚙️ 返回系統管理員介面</a>
    </div>

    <script>
        var _displayedEvents = [];

        async function copyTextToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (e) {
                    console.warn('navigator.clipboard failed, fallback:', e);
                }
            }
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '0';
            textArea.style.top = '0';
            textArea.style.opacity = '0';
            textArea.style.pointerEvents = 'none';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            textArea.setSelectionRange(0, 99999);
            let success = false;
            try {
                success = document.execCommand('copy');
            } catch (err) {
                console.error('execCommand failed:', err);
            }
            document.body.removeChild(textArea);
            return success;
        }

        function copyGroupEvent(idx, btn) {
            const event = _displayedEvents[idx];
            if (!event) return;

            const dateObj = parseLocalDate(event["日期"]);
            const dateStr = event["日期"] || (dateObj ? formatDate(dateObj) : '');
            const weekDay = dateObj ? ` (星期${['日', '一', '二', '三', '四', '五', '六'][dateObj.getDay()]})` : '';
            const groupName = event["分頁名稱"] || '小組';
            const isFellowship = groupName.includes('團契');
            const topic = event["主題"] || event["聚會名稱"] || (isFellowship ? '團契聚會' : '小組聚會');
            const location = event["地點"] || '';
            const scripture = event["經文"] || '';

            const excludeFields = ["日期", "分頁名稱", "模板類型", "聚會名稱", "聚會類別", "地點", "經文", "主題", "講道連動", "套用講道"];
            const dutyLines = Object.keys(event)
                .filter(key => !excludeFields.includes(key) && event[key] && event[key] !== "-")
                .map(key => `  • ${key}：${event[key]}`);

            let lines = [
                `🌿【${groupName} 聚會資訊】`,
                `📅 日期：${dateStr}${weekDay}`,
                `🏷️ 主題：${topic}`
            ];
            if (location) lines.push(`📍 地點：${location}`);
            if (scripture) {
                const verseUrl = new URL(`verse_view.html?q=${encodeURIComponent(scripture)}`, window.location.href).href;
                lines.push(`📖 經文：${scripture}`);
                lines.push(`🔗 經文連結：${verseUrl}`);
            }
            if (dutyLines.length > 0) {
                lines.push(`👥 服事同工：`);
                lines.push(...dutyLines);
            }

            const textToCopy = lines.join('\n');
            copyTextToClipboard(textToCopy).then(success => {
                if (success && btn) {
                    const origHtml = btn.innerHTML;
                    btn.innerHTML = `
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        <span>已複製！</span>
                    `;
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.innerHTML = origHtml;
                        btn.classList.remove('copied');
                    }, 1500);
                }
            });
        }
        window.copyGroupEvent = copyGroupEvent;

        document.addEventListener('DOMContentLoaded', fetchAndRenderBoard);

        async function fetchAndRenderBoard() {
            const container = document.getElementById('boardGrid');
            const dateRangeText = document.getElementById('dateRangeText');

            try {
                // 🌟 修改點 2：加入耐心等待機制，最多等 3 秒讓 config.js 載入完畢
                let retryCount = 0;
                while (typeof window.churchAPI !== 'function' && retryCount < 30) {
                    await new Promise(resolve => setTimeout(resolve, 100)); // 每次等 0.1 秒
                    retryCount++;
                }

                // 🌟 3. 如果等了 3 秒還是沒有，才拋出錯誤
                if (typeof window.churchAPI !== 'function') {
                    throw new Error("系統安全設定 (config.js) 連線超時，請檢查網路或強制重新整理 (Ctrl+F5)。");
                }

                // 處理日期區間：今天 ~ 今天+7天
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const next7Days = new Date();
                next7Days.setDate(today.getDate() + 6);
                next7Days.setHours(23, 59, 59, 999);

                // 講道連動查詢區間（前後各14天）
                const sermonStart = new Date(today);
                sermonStart.setDate(sermonStart.getDate() - 14);
                const sermonEnd = new Date(today);
                sermonEnd.setDate(sermonEnd.getDate() + 14);

                // 🌟 同步平行載入「小組」、「其他團契」與「行事曆講道資訊」（全走快取機制）
                const [smRes, othRes, sermonList] = await Promise.all([
                    window.churchAPI('getAggregatedReport', { type: 'smallGroup' }),
                    window.churchAPI('getAggregatedReport', { type: 'others' }),
                    fetchSermonData(formatDate(sermonStart), formatDate(sermonEnd)).catch(se => {
                        console.warn("無法取得主日講道行事曆，將僅使用 Sheets 本身儲存的資料:", se);
                        return [];
                    })
                ]);

                if (smRes.status !== 'success') throw new Error(smRes.message || "小組資料抓取失敗");

                const smData = matrixToObjects(smRes.data);
                const othData = (othRes && othRes.status === 'success')
                    ? matrixToObjects(othRes.data).filter(r => r['模板類型'] === '聚會型模板' || r['模板類型'] === 'gathering')
                    : [];
                // 🛡️ 雙重防護：嚴格限定僅保留小組與團契聚會型模板，杜絕事工服事排班混入
                const allRawData = [...smData, ...othData].filter(r => 
                    r['模板類型'] === '小組聚會表模板' || r['模板類型'] === '團契聚會表模板' || r['模板類型'] === '聚會型模板' || r['模板類型'] === 'gathering'
                );

                // 🌟 針對每筆小組聚會，若設定了「套用講道」且主題/經文為空白或為「待定」，在前端動態連動最新講道資訊
                allRawData.forEach(event => {
                    resolveSermonForEvent(event, sermonList || []);
                });

                dateRangeText.innerHTML = `願你們平安，在小組團契裡常存愛的陪伴❤️❤️❤️<br>📅 小組團契聚會預告：${formatDate(today)} ~ ${formatDate(next7Days)}`;

                // 過濾與排序
                const filteredEvents = allRawData.filter(item => {
                    const itemDate = parseLocalDate(item["日期"]);
                    if (!itemDate) return false;
                    return itemDate >= today && itemDate <= next7Days;
                }).sort((a, b) => parseLocalDate(a["日期"]) - parseLocalDate(b["日期"]));

                _displayedEvents = filteredEvents;

                if (filteredEvents.length === 0) {
                    container.innerHTML = '<div class="no-data">✨ 近期小組尚無已排定的聚會資訊</div>';
                    return;
                }

                // 渲染
                container.innerHTML = filteredEvents.map((event, idx) => {
                    const dateObj = parseLocalDate(event["日期"]);
                    const day = String(dateObj.getDate()).padStart(2, '0');
                    const yearMonth = `${dateObj.getFullYear()}年 ${dateObj.getMonth() + 1}月`;
                    const weekDay = ['日', '一', '二', '三', '四', '五', '六'][dateObj.getDay()];

                    // 排除欄位
                    const excludeFields = ["日期", "分頁名稱", "模板類型", "聚會名稱", "聚會類別", "地點", "經文", "主題", "講道連動", "套用講道"];
                    
                    // 抓取服事內容
                    const duties = Object.keys(event)
                        .filter(key => !excludeFields.includes(key) && event[key] && event[key] !== "-")
                        .map(key => `
                            <div class="info-row">
                                <span class="info-label">${key}</span>
                                <span class="info-value">${event[key]}</span>
                            </div>
                        `).join('');

                    return `
                        <div class="event-card">
                            <div class="date-badge">
                                <div class="day">${day}</div>
                                <div class="ym">${yearMonth} (星期${weekDay})</div>
                            </div>
                            <div class="card-body">
                                <div class="card-header-flex">
                                    <span class="group-tag ${String(event["分頁名稱"] || '').includes('團契') ? 'fellowship' : ''}">${event["分頁名稱"]}${String(event["分頁名稱"] || '').includes('團契') ? ' · 團契' : ''}</span>
                                    <button type="button" class="btn-copy-card" onclick="copyGroupEvent(${idx}, this)" title="一鍵複製此日聚會資訊">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                        <span>複製資訊</span>
                                    </button>
                                </div>
                                <div class="event-name">${event["主題"] || event["聚會名稱"] || (String(event["分頁名稱"] || '').includes('團契') ? '團契聚會' : '小組聚會')}</div>
                                
                                <div class="duty-section">
                                    ${duties || '<div class="text-center text-muted small">一般聚會，無需特別服事</div>'}
                                </div>

                                ${event["地點"] ? `<div class="info-row small mt-2"><span class="info-label">📍 地點:</span> <span>${event["地點"]}</span></div>` : ''}
                                ${event["經文"] ? `<div class="info-row small"><span class="info-label">📖 經文:</span> <span><a href="verse_view.html?q=${encodeURIComponent(event["經文"])}" target="_blank" class="verse-link">${event["經文"]}</a></span></div>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="no-data text-danger">⚠️ 連線失敗：${err.message}</div>`;
            }
        }

        async function fetchSermonData(startDateStr, endDateStr) {
            try {
                const res = await window.churchAPI('cal_getEvents', { startDate: startDateStr, endDate: endDateStr });
                if (!res || !res.success) return [];
                
                const dateMap = {};
                const events = res.data || [];
                events.forEach(ev => {
                    if (!ev.date) return;
                    const dateOnly = ev.date.split(' ')[0]; // "2026-06-21"
                    if (!dateMap[dateOnly]) {
                        dateMap[dateOnly] = {
                            date: dateOnly,
                            sermons: []
                        };
                    }
                    
                    let title = "";
                    let scripture = "";
                    let speaker = "";
                    if (ev.values && Array.isArray(ev.values)) {
                        const titleVal = ev.values.find(v => v.fieldName === "講題" || v.fieldName === "主題");
                        const scriptureVal = ev.values.find(v => v.fieldName === "經文");
                        const speakerVal = ev.values.find(v => v.fieldName === "講員");
                        if (titleVal) title = titleVal.value || "";
                        if (scriptureVal) scripture = scriptureVal.value || "";
                        if (speakerVal) speaker = speakerVal.value || "";
                    }
                    if (!title) {
                        title = ev.title ? ev.title.replace(/（.*）|\(.*\)|\s*牧師.*/, '') : "";
                    }
                    
                    dateMap[dateOnly].sermons.push({
                        title: title.trim(),
                        scripture: scripture.trim(),
                        type: ev.typeName || "",
                        speaker: speaker.trim()
                    });
                });
                
                return Object.values(dateMap);
            } catch (e) {
                console.error("[SermonLink] Failed to fetch sermon data:", e);
                return [];
            }
        }

        function getSundayStrForDate(dateObj) {
            const d = new Date(dateObj.getTime());
            const dayOfWeek = d.getDay(); // 0-6 (0 代表星期日)
            const offset = dayOfWeek === 0 ? 7 : dayOfWeek;
            d.setDate(d.getDate() - offset);
            return formatDate(d);
        }

        function resolveSermonForEvent(event, sermonList) {
            const rawLinkType = event["套用講道"];
            if (rawLinkType === undefined || rawLinkType === null) return;
            const linkStr = String(rawLinkType).trim();
            if (!linkStr || linkStr === "N" || linkStr.toUpperCase() === "FALSE" || linkStr === "0") {
                return;
            }
            
            const itemDate = parseLocalDate(event["日期"]);
            if (!itemDate) return;
            
            const sundayStr = getSundayStrForDate(itemDate);
            const sundayEvents = (sermonList || []).filter(ev => ev.date === sundayStr);
            if (sundayEvents.length === 0) {
                event["主題"] = "主日講道信息";
                event["經文"] = "";
                return;
            }
            
            const sermons = [];
            sundayEvents.forEach(ev => {
                if (ev.sermons && ev.sermons.length > 0) {
                    sermons.push(...ev.sermons);
                }
            });
            
            if (sermons.length === 0) {
                event["主題"] = "主日講道信息";
                event["經文"] = "";
                return;
            }
            
            const sermonType = (linkStr === "Y" || linkStr.toUpperCase() === "TRUE" || linkStr === "1") ? "華語/聯合" : linkStr;
            const targetTypes = sermonType.split('/');
            let match = null;
            for (const t of targetTypes) {
                const trimmed = t.trim();
                if (!trimmed) continue;
                match = sermons.find(s => s.type && s.type.indexOf(trimmed) !== -1);
                if (match) break;
            }
            
            if (match) {
                event["主題"] = (match.title || "").trim() || "主日講道信息";
                event["經文"] = (match.scripture || "").trim();
            } else {
                event["主題"] = "主日講道信息";
                event["經文"] = "";
            }
        }

        function matrixToObjects(matrix) {
            if (!matrix) return [];
            if (Array.isArray(matrix)) {
                if (matrix.length < 2) return [];
                const headers = matrix[0];
                if (!Array.isArray(headers)) return matrix; // already array of objects
                return matrix.slice(1).map(row => {
                    let obj = {};
                    headers.forEach((h, i) => obj[h] = row[i]);
                    return obj;
                });
            }
            if (typeof matrix === 'object') {
                if (Array.isArray(matrix.matrix)) return matrixToObjects(matrix.matrix);
                if (Array.isArray(matrix.reports)) return matrix.reports;
                if (Array.isArray(matrix.data)) return matrixToObjects(matrix.data);
            }
            return [];
        }

        function formatDate(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function parseLocalDate(value) {
            if (value instanceof Date && !isNaN(value)) {
                return new Date(value.getFullYear(), value.getMonth(), value.getDate());
            }
            const parts = String(value || '').match(/\d+/g);
            if (!parts || parts.length < 3) return null;

            let year = parseInt(parts[0], 10);
            let month = parseInt(parts[1], 10);
            let day = parseInt(parts[2], 10);
            if (year < 100) year += 2000;
            if (year >= 100 && year <= 200) year += 1911;

            const parsed = new Date(year, month - 1, day);
            if (
                parsed.getFullYear() !== year ||
                parsed.getMonth() !== month - 1 ||
                parsed.getDate() !== day
            ) return null;
            return parsed;
        }
    </script>
</body>
</html>
