<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>敬拜團服事公佈欄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260606_green">
</head>
<body>

<div class="text-center mb-4 mt-3">
  <h2 class="fw-bold">⛪ 敬拜團服事公佈欄</h2>
</div>

<div class="main-card" style="background:transparent !important; border:none !important; box-shadow:none !important; padding:0 !important;">
  <div class="quarter-box d-flex justify-content-between align-items-center" style="background: rgba(255, 255, 255, 0.6) !important; backdrop-filter: blur(10px); border: 1px solid rgba(0, 96, 48, 0.08); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px;">
    <h5 class="mb-0 fw-bold" style="color: #006030;">📅 查詢季度</h5>
    <div class="d-flex align-items-center gap-3">
      <div class="view-toggle-group">
        <button type="button" class="btn view-toggle-btn active" id="viewBtnCards" onclick="switchView('cards')">📱 玻璃卡片</button>
        <button type="button" class="btn view-toggle-btn" id="viewBtnTable" onclick="switchView('table')">📊 傳統表格</button>
      </div>
      <span class="text-muted small d-none d-sm-inline">最後同步：<span id="syncTime">--:--</span></span>
      <select id="yearSelect" class="form-select w-auto fw-bold" onchange="loadDashboard()" style="border: 1.5px solid rgba(0, 96, 48, 0.15) !important;">
        <option value="2024">2024</option>
        <option value="2025">2025</option>
        <option value="2026" selected>2026</option>
        <option value="2027">2027</option>
        <option value="2028">2028</option>
      </select>
      <select id="quarterSelect" class="form-select w-auto fw-bold" onchange="loadDashboard()" style="border: 1.5px solid rgba(0, 96, 48, 0.15) !important;">
        <option value="Q1">Q1</option>
        <option value="Q2" selected>Q2</option>
        <option value="Q3">Q3</option>
        <option value="Q4">Q4</option>
      </select>
    </div>
  </div>

  <!-- 🔍 團員個人班表查詢 -->
  <div class="search-member-box mb-4" style="background: rgba(255, 255, 255, 0.6) !important; backdrop-filter: blur(10px); border: 1px solid rgba(0, 96, 48, 0.08); border-radius: 12px; padding: 16px 20px;">
    <div class="row align-items-center g-3">
      <div class="col-12 col-md-5">
        <h6 class="mb-1 fw-bold" style="color: #006030;">🔍 團員個人班表查詢</h6>
        <span class="text-muted small">輸入您的姓名，查詢本季度的服事天數與細節</span>
      </div>
      <div class="col-12 col-md-7">
        <div class="input-group">
          <input type="text" id="memberSearchInput" class="form-control fw-bold" placeholder="輸入或選取您的姓名..." oninput="queryMemberSchedule()" onfocus="showMemberSearchDropdown(this)" onclick="showMemberSearchDropdown(this)" autocomplete="off">
          <button class="btn btn-outline-secondary" type="button" onclick="clearMemberSearch()">清除</button>
        </div>
      </div>
    </div>
    <div id="memberSearchResult" class="mt-3" style="display: none;"></div>
  </div>

  <div id="dashboardContainer">
    <div class="text-center p-5 text-muted">
      <div class="spinner-border text-primary mb-2"></div>
      <div>正在同步最新資料...</div>
    </div>
  </div>
</div>
<script>window._GAS_KEY = 'LKC_worship'; window._FORCE_PRODUCTION_GAS = true;</script>
<script src="../../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../supabase/supabase-config.js"></script>
<script src="worship-supabase.js?v=20260910"></script>
<script src="script.js?v=20260910"></script>
</body>
</html>
