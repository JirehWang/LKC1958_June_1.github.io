<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <script type="module" src="../../firebase/observability-browser.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
    #reader { width: 100vw; height: 100vh; transition: transform 0.1s; }
    
    #flash {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(40, 167, 69, 0.8);
      display: none; z-index: 999; pointer-events: none;
      border: 20px solid #28a745;
      box-sizing: border-box;
    }

    .scan-success-effect { animation: pulse-visual 0.4s ease-out; }

    @keyframes pulse-visual {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    #switch-btn {
      position: fixed; bottom: 30px; right: 30px;
      width: 55px; height: 55px; background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; backdrop-filter: blur(10px); cursor: pointer;
    }
    #switch-btn svg { fill: white; width: 28px; height: 28px; }

    #status-tip {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.5); color: #fff; padding: 5px 15px;
      border-radius: 20px; font-size: 12px; z-index: 1000; pointer-events: none;
      white-space: nowrap;
    }

    /* ?? ?輸?批?? */
    #sound-btn {
      position: fixed; bottom: 30px; left: 30px;
      width: 55px; height: 55px; background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; backdrop-filter: blur(10px); cursor: pointer;
      transition: all 0.2s ease;
    }
    #sound-btn:active { transform: scale(0.9); }
    #sound-btn svg { fill: rgba(255, 255, 255, 0.4); width: 28px; height: 28px; transition: fill 0.2s; }
    #sound-btn.active {
      background: rgba(40, 167, 69, 0.35);
      border-color: rgba(40, 167, 69, 0.6);
      box-shadow: 0 0 12px rgba(40, 167, 69, 0.4);
    }
    #sound-btn.active svg { fill: white; }
  </style>
</head>
<body>

  <div id="status-tip">蝑? QR Code... (v5 ??詨捆??</div>
  <div id="flash"></div>
  <div id="reader"></div>
  
  <div id="sound-btn" onclick="toggleSound()"></div>

  <div id="switch-btn" onclick="switchCamera()">
    <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxBOFeLiXu23kBMGU8iSvRyJci6fruTfk7HdahhcQFY777sCPSgasuNM7Z1CeuzuS-r/exec";
    const ATTENDANCE_TEMP_MODULE_URL = new URL('../../firebase/attendance-temp.js', document.baseURI).href;
    const ATTENDANCE_QR_QUEUE_KEY = 'attendance_qr_pending_v1';
    const MAX_PENDING_SCANS = 100;
    const ATTENDANCE_TEMP_FLUSH_INTERVAL_MS = 30000;
    const ATTENDANCE_QR_OPERATOR_KEY = 'attendance_qr_operator_v2';
    const MAX_SCAN_WRITE_BATCH = 8;
    const tempModulePromise = import(ATTENDANCE_TEMP_MODULE_URL);
    
    let isProcessing = false;
    let html5QrCode = null;
    let cameraList = [];
    let currentCameraIndex = 0;
    let pendingScanFlush = false;
    let sheetFlushInFlight = false;

    let lastScannedData = "";
    let lastScannedTime = 0;

    // ?? ?輸?????(?身??嚗摮 localStorage)
    let isSoundEnabled = localStorage.getItem('qr_sound') !== 'false';

    function updateToggleUI() {
      const soundBtn = document.getElementById('sound-btn');

      if (isSoundEnabled) {
        soundBtn.classList.add('active');
        soundBtn.innerHTML = `
          <svg viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        `;
      } else {
        soundBtn.classList.remove('active');
        soundBtn.innerHTML = `
          <svg viewBox="0 0 24 24">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        `;
      }
    }

    function toggleSound() {
      isSoundEnabled = !isSoundEnabled;
      localStorage.setItem('qr_sound', isSoundEnabled);
      updateToggleUI();
      if (isSoundEnabled) {
        playBeep();
      }
    }

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime); // 1000Hz ?嗉
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12); // 120ms 瞍詨摹??
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.12);
      } catch (err) {
        console.error("?嗉?Ｙ?憭望?:", err);
      }
    }

    let hasInteracted = false;
    function unlockAPIs() {
      if (hasInteracted) return;
      hasInteracted = true;
      
      // 閫貊?單?閫??
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {}
      
      // 蝘駁?芾孛蝣唳?蝷?
      const tip = document.getElementById('status-tip');
      if (tip && tip.innerText.includes("閫貊１?Ｗ?")) {
        tip.innerText = "蝑? QR Code... (v5 ???";
      }
      
      document.removeEventListener('click', unlockAPIs);
      document.removeEventListener('touchstart', unlockAPIs);
    }
    
    document.addEventListener('click', unlockAPIs);
    document.addEventListener('touchstart', unlockAPIs);

    function loadPendingScans() {
      try {
        const parsed = JSON.parse(localStorage.getItem(ATTENDANCE_QR_QUEUE_KEY) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        console.warn('霈??QR ?岫雿?憭望?', error);
        return [];
      }
    }

    function savePendingScans(items) {
      localStorage.setItem(ATTENDANCE_QR_QUEUE_KEY, JSON.stringify(items.slice(-MAX_PENDING_SCANS)));
    }

    function getScanScope() {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get('mode') || localStorage.getItem('attendance_scope') || '';
      if (!mode || mode.indexOf('AGM:') === 0 || mode.indexOf('|date:') !== -1) return mode;
      const date = String(params.get('date') || '').trim().replace(/\//g, '-');
      const now = new Date();
      const localDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      return mode + '|date:' + (date || localDate);
    }

    function getOperatorId() {
      const params = new URLSearchParams(window.location.search);
      const urlOperatorId = String(params.get('operatorId') || params.get('userId') || '').trim();
      if (urlOperatorId) {
        try { localStorage.setItem(ATTENDANCE_QR_OPERATOR_KEY, urlOperatorId); } catch (error) {}
        return urlOperatorId;
      }
      let operatorId = '';
      try { operatorId = localStorage.getItem(ATTENDANCE_QR_OPERATOR_KEY) || ''; } catch (error) {}
      if (!operatorId) {
        const random = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        operatorId = `QR_${random}`;
        try { localStorage.setItem(ATTENDANCE_QR_OPERATOR_KEY, operatorId); } catch (error) {}
      }
      return operatorId;
    }

    function enqueueScan(uid, scope, operatorId) {
      const normalizedUid = String(uid || '').trim().toUpperCase();
      if (!/^LK\d+$/i.test(normalizedUid)) throw new Error('QR Code ?芸??急???UID');
      if (!scope) throw new Error('Scanner scope is required');
      const queue = loadPendingScans();
      let item = queue.find(entry => entry.scope === scope && entry.uid === normalizedUid);
      if (!item) {
        if (queue.length >= MAX_PENDING_SCANS) throw new Error('Pending scan queue is full');
        const now = Date.now();
        item = {
          id: (crypto.randomUUID ? crypto.randomUUID() : `${now}-${Math.random()}`),
          scope,
          uid: normalizedUid,
          operatorId,
          source: 'qr',
          requestId: `${scope}:${normalizedUid}:${operatorId}:${now}`,
          updatedAt: now,
          attempts: 0
        };
        queue.push(item);
      }
      item.checked = true;
      item.updatedAt = Number(item.updatedAt || Date.now());
      savePendingScans(queue);
      return item;
    }

    function updatePendingScanQueueItem(id, requestId, updatedAt, updater) {
      const latest = loadPendingScans();
      const index = latest.findIndex(entry => entry.id === id && entry.requestId === requestId && entry.updatedAt === updatedAt);
      if (index === -1) return false;
      const next = updater(latest[index]);
      if (next === null) latest.splice(index, 1);
      else if (next) latest[index] = next;
      savePendingScans(latest);
      return true;
    }

    async function flushPendingScans() {
      if (pendingScanFlush) return { attempted: 0, acknowledged: 0 };
      const queue = loadPendingScans();
      if (!queue.length) return { attempted: 0, acknowledged: 0 };
      pendingScanFlush = true;
      let acknowledged = 0;
      let successfulWrites = 0;
      try {
        const store = await tempModulePromise;
        const batch = queue.slice(0, MAX_SCAN_WRITE_BATCH);
        await Promise.all(batch.map(async item => {
          item.attempts = Number(item.attempts || 0) + 1;
          try {
            const result = await store.writeAttendanceTemp({
              scope: item.scope,
              uid: item.uid,
              checked: item.checked !== false,
              operatorId: item.operatorId,
              source: 'qr',
              requestId: item.requestId,
              updatedAt: item.updatedAt
            });
            successfulWrites++;
            if (result && result.committed === false) {
              console.info('QR write was a safe no-op; Firebase final state wins', item.uid);
            }
            if (updatePendingScanQueueItem(item.id, item.requestId, item.updatedAt, () => null)) {
              acknowledged++;
            }
          } catch (error) {
            updatePendingScanQueueItem(item.id, item.requestId, item.updatedAt, current => ({
              ...current,
              attempts: Number(current.attempts || 0) + 1,
              lastError: String(error && error.message || error)
            }));
            console.warn('Firebase temp write ACK failed; retrying', item.uid, error);
          }
        }));
        if (successfulWrites && loadPendingScans().length) {
          setTimeout(() => { flushPendingScans(); }, 0);
        }
        return { attempted: batch.length, acknowledged };
      } catch (error) {
        console.warn('Firebase temp module unavailable; pending scans will retry', error);
        savePendingScans(queue);
        return { attempted: queue.length, acknowledged: 0 };
      } finally {
        pendingScanFlush = false;
      }
    }

    async function flushSheetTemp() {
      if (sheetFlushInFlight) return;
      const scope = getScanScope();
      if (!scope) return;
      sheetFlushInFlight = true;
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'flushAttendanceTemp',
            payload: { type: scope, userId: getOperatorId() }
          })
        });
        if (response.ok) await response.json().catch(() => null);
      } catch (error) {
        console.warn('敺?寞活?郊蝔??岫', error);
      } finally {
        sheetFlushInFlight = false;
      }
    }

    async function initScanner() {
      const formatsToSupport = [ Html5QrcodeSupportedFormats.QR_CODE ];
      html5QrCode = new Html5Qrcode("reader", { formatsToSupport: formatsToSupport });
      
      try {
        cameraList = await Html5Qrcode.getCameras();
        if (cameraList.length > 0) {
          // ?岫?曆蜓?⊿ (?虜??0 ??璅惜撣嗆? back)
          currentCameraIndex = cameraList.findIndex(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('rear'));
          if (currentCameraIndex === -1) currentCameraIndex = cameraList.length - 1;
          startCurrentCamera();
        }
      } catch (err) { alert("?⊥????豢??”: " + err); }
    }

    function startCurrentCamera() {
      const cameraId = cameraList[currentCameraIndex].id;
      const tip = document.getElementById('status-tip');
      tip.innerText = "?豢???銝?..";
      
      // ?? ?靽桀儔嚗??videoConstraints嚗??Pixel 7 Pro 憭?剛?蝒?
      const config = {
        fps: 30, 
        qrbox: (w, h) => { const s = Math.min(w, h) * 0.7; return { width: s, height: s }; }
      };

      html5QrCode.start(cameraId, config, (text) => { 
        if (!isProcessing) handleScan(text.trim()); 
      }).then(() => {
        tip.innerText = hasInteracted ? "蝑? QR Code... (v5 ???" : "蝑? QR Code... (閫貊１?Ｗ?隞亙??券??";
      }).catch(err => {
        console.warn("擃芋撘??仃???岫摰璅∪?", err);
        
        // ?儭?蝯扔摰??芋撘????雿?
        html5QrCode.start(cameraId, { fps: 15, qrbox: 250 }, (text) => {
           if (!isProcessing) handleScan(text.trim());
        }).then(() => {
           tip.innerText = hasInteracted ? "蝑? QR Code... (摰璅∪?)" : "蝑? QR Code... (閫貊１?Ｗ?隞亙??券??";
        }).catch(err2 => {
           tip.innerText = "???豢???憭望?";
           tip.style.background = "#dc3545";
           alert("Camera failed in fallback mode: " + err2);
         });
      });
    }

    async function switchCamera() {
      if (cameraList.length < 2) return;
      if (html5QrCode.isScanning) await html5QrCode.stop();
      currentCameraIndex = (currentCameraIndex + 1) % cameraList.length;
      startCurrentCamera();
    }

    async function handleScan(data) {
      const now = Date.now();
      if (data === lastScannedData && (now - lastScannedTime) < 5000) return; 

      if (isProcessing) return; 
      isProcessing = true;
      
      lastScannedData = data;
      lastScannedTime = now;
      
      const flash = document.getElementById('flash');
      const reader = document.getElementById('reader');
      const tip = document.getElementById('status-tip');
      
      flash.style.display = 'block'; 
      reader.classList.add('scan-success-effect'); 
      tip.innerText = "Scan received: " + data;
      tip.style.background = "#28a745";

      if (isSoundEnabled) {
        playBeep();
      }

      const mode = getScanScope();
      const operatorId = getOperatorId();
      try {
        enqueueScan(data, mode, operatorId);
        const result = await flushPendingScans();
        tip.innerText = result.acknowledged ? "✅ 已取得 Firebase ACK：" + data : "⏳ 已排入重試佇列：" + data;
        tip.style.background = result.acknowledged ? "#28a745" : "#f59e0b";
      } catch (error) {
        tip.innerText = "❌ 寫入失敗，請重試";
        tip.style.background = "#dc3545";
        console.error('QR 點名失敗', error);
      }

      // Legacy GAS fire-and-forget write removed; Firebase ACK is the source of truth.

      setTimeout(() => {
        flash.style.display = 'none';
        reader.classList.remove('scan-success-effect');
        tip.innerText = "蝑? QR Code... (v5 ???";
        tip.style.background = "rgba(0,0,0,0.5)";
        isProcessing = false; 
      }, 1200); 
    }

    window.onload = function() {
      initScanner();
      updateToggleUI();
      setInterval(flushPendingScans, 1000);
      setInterval(flushSheetTemp, ATTENDANCE_TEMP_FLUSH_INTERVAL_MS);
      flushPendingScans();
      flushSheetTemp();
    };
  </script>
</body>
</html>
