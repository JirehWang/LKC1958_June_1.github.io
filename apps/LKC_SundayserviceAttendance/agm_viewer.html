<script type="module" src="../../firebase/observability-browser.js"></script>
<style>
  .agm-viewer-card {
    background: rgba(255, 255, 255, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    backdrop-filter: blur(16px);
  }
  .agm-viewer-stat {
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 12px;
    min-height: 88px;
  }
  .agm-viewer-stat-value { font-size: 1.55rem; line-height: 1; font-weight: 800; color: var(--text-primary); }
  .agm-viewer-stat-label { font-size: .76rem; color: var(--text-secondary); font-weight: 700; margin-top: 8px; }
  .agm-viewer-member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .agm-viewer-member {
    min-height: 62px;
    padding: 8px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    background: rgba(255, 255, 255, .82);
  }
  .agm-viewer-member.present { background: rgba(16, 185, 129, .14); border-color: rgba(16, 185, 129, .34); }
  .agm-viewer-member.leave { background: rgba(245, 158, 11, .13); border-color: rgba(245, 158, 11, .38); }
  .agm-viewer-member-name { font-weight: 700; color: var(--text-primary); font-size: .86rem; }
  .agm-viewer-member-status { font-size: .7rem; color: var(--text-secondary); margin-top: 4px; }
  .agm-viewer-readonly { color: var(--color-teal-hover); background: rgba(6, 182, 212, .1); border-radius: 999px; padding: 5px 10px; font-size: .75rem; font-weight: 800; }
  #agmViewerMemberList { max-height: calc(100vh - 390px); overflow-y: auto; }
</style>

<div class="agm-viewer-card p-3 mb-3">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div>
      <h4 class="mb-1 fw-bold" style="color: var(--text-primary);">會員大會即時觀看</h4>
      <div id="agmViewerSessionLabel" class="small text-secondary">請選擇要觀看的場次</div>
    </div>
    <span class="agm-viewer-readonly">📺 唯讀介面</span>
  </div>

  <div class="row g-2 align-items-end">
    <div class="col-12 col-md-8">
      <label for="agmViewerSessionSelect" class="form-label small text-secondary fw-bold mb-1">場次名稱</label>
      <select id="agmViewerSessionSelect" class="form-select border-0" onchange="selectAgmViewerSession(this.value)">
        <option value="">載入場次中…</option>
      </select>
    </div>
    <div class="col-12 col-md-auto">
      <button class="btn btn-sm btn-outline-secondary fw-bold" onclick="refreshAgmViewer()" style="border-radius: 12px;">↻ 更新狀態</button>
    </div>
  </div>
</div>

<div class="agm-viewer-card p-3 mb-3">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <span class="fw-bold" style="color: var(--text-primary);">即時成會進度</span>
    <span id="agmViewerStatusBadge" class="badge bg-warning text-dark" style="border-radius: 999px;">等待選擇場次</span>
  </div>
  <div class="progress mb-3" style="height: 11px; border-radius: 999px; background: rgba(15, 42, 53, .08);">
    <div id="agmViewerProgressBar" class="progress-bar" style="width: 0%; background: var(--color-green);"></div>
  </div>
  <div class="row g-2">
    <div class="col-6 col-lg-3"><div class="agm-viewer-stat"><div id="agmViewerEligible" class="agm-viewer-stat-value">—</div><div class="agm-viewer-stat-label">應到（扣除請假）</div></div></div>
    <div class="col-6 col-lg-3"><div class="agm-viewer-stat"><div id="agmViewerLeave" class="agm-viewer-stat-value" style="color: #9a6700;">—</div><div class="agm-viewer-stat-label">已請假</div></div></div>
    <div class="col-6 col-lg-3"><div class="agm-viewer-stat"><div id="agmViewerPresent" class="agm-viewer-stat-value" style="color: var(--color-green);">—</div><div class="agm-viewer-stat-label">CAT_1 實到</div></div></div>
    <div class="col-6 col-lg-3"><div class="agm-viewer-stat"><div id="agmViewerThreshold" class="agm-viewer-stat-value" style="color: var(--color-teal-hover);">—</div><div class="agm-viewer-stat-label">超過 50% 門檻</div></div></div>
  </div>
  <div id="agmViewerUpdatedAt" class="small text-secondary mt-3">尚未同步</div>
</div>

<div class="agm-viewer-card p-3">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <span class="fw-bold" style="color: var(--text-primary);">會員點名狀態</span>
    <span class="small text-secondary">每 5 秒自動同步</span>
  </div>
  <div id="agmViewerMemberList" class="agm-viewer-member-grid">
    <div class="text-secondary small py-4 text-center" style="grid-column: 1 / -1;">選擇場次後顯示狀態</div>
  </div>
</div>

<script src="agm_viewer.js"></script>
