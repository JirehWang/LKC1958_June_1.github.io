<script type="module" src="../../firebase/observability-browser.js"></script>
<style>
  .stats-container { padding: 8px; background-color: transparent; border-radius: var(--radius-lg); }
  .progress { background-color: #f1f5f9; border-radius: 8px; box-shadow: none; height: 8px; overflow: hidden; }
  .progress-bar { background: linear-gradient(90deg, var(--color-teal), var(--color-teal-hover)) !important; border-radius: 8px; }
  .mode-switch-btn { width: 50%; font-weight: 600; font-size: 0.85rem; border-color: var(--border-color); }
  .mode-switch-btn:hover { background-color: rgba(6, 182, 212, 0.05); color: var(--color-teal-hover); border-color: var(--color-teal); }
  .btn-check:checked + .mode-switch-btn { background-color: var(--color-teal) !important; border-color: var(--color-teal) !important; color: white !important; }
  .stat-card { 
    border-radius: var(--radius-md); 
    padding: 14px; 
    box-shadow: var(--shadow-soft); 
    height: 100%; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    border: 1px solid var(--border-color); 
    background-color: white;
    transition: transform 0.3s;
  }
  .stat-card:hover { transform: translateY(-2px); }
  
  .stats-table-header th {
    background-color: var(--text-primary) !important;
    color: white !important;
    font-weight: 600;
    padding: 12px 16px !important;
    border-bottom: 0;
  }
  .stats-table-container tbody td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-color);
  }
  .stats-table-container tbody tr:hover td {
    background-color: rgba(6, 182, 212, 0.02) !important;
  }
</style>

<div class="stats-container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0 text-dark" style="font-size: 1.3rem; letter-spacing: -0.3px;">📊 聚會出席統計</h4>
  </div>
  
  <div class="p-3 bg-white border-0 shadow-sm mb-3" style="border-radius: var(--radius-lg);">
    <div class="btn-group w-100 mb-3" role="group" style="border-radius: 20px; overflow: hidden; border: 1px solid var(--border-color);">
      <input type="radio" class="btn-check" name="statMode" id="modeRange" autocomplete="off" checked onclick="toggleStatMode('range')">
      <label class="btn btn-light mode-switch-btn border-0 py-2" for="modeRange">📅 區間統計</label>
      <input type="radio" class="btn-check" name="statMode" id="modeSingle" autocomplete="off" onclick="toggleStatMode('single')">
      <label class="btn btn-light mode-switch-btn border-0 py-2" for="modeSingle">📆 單日檢視</label>
    </div>

    <div class="row g-2 align-items-end" id="rangeInputArea">
      <div class="col-6">
        <label class="small text-secondary fw-bold mb-1">開始日期</label>
        <input type="date" id="statsStart" class="form-control border-0 bg-light py-2" style="border-radius: 8px; font-size: 0.85rem;">
      </div>
      <div class="col-6">
        <label class="small text-secondary fw-bold mb-1">結束日期</label>
        <input type="date" id="statsEnd" class="form-control border-0 bg-light py-2" style="border-radius: 8px; font-size: 0.85rem;">
      </div>
      <div class="col-12 mt-2">
         <label class="small text-secondary fw-bold mb-1">出席率門檻 (%)</label>
         <input type="number" id="threshold" class="form-control border-0 bg-light py-2" value="100" min="0" max="100" placeholder="顯示低於此%的人" style="border-radius: 8px; font-size: 0.85rem;">
      </div>
    </div>

    <div class="row g-2 align-items-end" id="singleInputArea" style="display: none;">
      <div class="col-12">
        <label class="small text-secondary fw-bold mb-1">選擇日期</label>
        <input type="date" id="statsSingleDate" class="form-control border-0 bg-light py-2" style="border-radius: 8px; font-size: 0.85rem;">
      </div>
    </div>

    <div class="row g-2 mt-2">
      <div class="col-12">
        <label class="small text-secondary fw-bold mb-1">名單過濾基準</label>
        <select id="baseSheetSource" class="form-select border-0 bg-light py-2 fw-bold" style="border-radius: 8px; font-size: 0.85rem;">
          <option value="會友名單">👥 依據全體會友</option>
          <option value="會員名單">🌟 依據正式會員</option>
        </select>
      </div>
    </div>

    <div class="row g-2 mt-2 bg-light p-3 rounded-3 border-0 align-items-end" style="border-radius: 12px !important; background-color: rgba(6, 182, 212, 0.03) !important;">
      <div class="col-5">
        <label class="small text-secondary fw-bold mb-1">📂 點名類別</label>
        <select id="statsCategorySelect" class="form-select border-0 bg-white py-2 fw-bold" onchange="updateStatsGroupSelect()" style="border-radius: 8px; font-size: 0.85rem; color: var(--text-primary);">
          <option value="" disabled selected>載入中...</option>
        </select>
      </div>
      <div class="col-7">
        <label class="small text-secondary fw-bold mb-1">📌 選擇群組</label>
        <select id="statsGroupSelect" class="form-select border-0 bg-white py-2 fw-bold text-primary" onchange="fetchStatsData()" style="border-radius: 8px; font-size: 0.85rem; color: var(--color-teal) !important;">
          <option value="" disabled selected>載入中...</option>
        </select>
      </div>
    </div>

    <div class="row g-2 mt-3">
      <div class="col-6">
        <button class="btn btn-primary w-100 fw-bold border-0 py-2 shadow-sm" onclick="fetchStatsData()" style="border-radius: 20px; font-size: 0.85rem; background-color: var(--color-teal);">🔍 開始查詢</button>
      </div>
      <div class="col-6">
        <button class="btn btn-success w-100 fw-bold border-0 py-2 shadow-sm" onclick="exportToCSV()" style="border-radius: 20px; font-size: 0.85rem; background-color: var(--color-green);">📥 匯出 Excel</button>
      </div>
    </div>

    <div class="row g-2 mt-2" id="trendAnalysisRow" style="display:none;">
      <div class="col-12">
        <button class="btn btn-warning w-100 fw-bold border-0 py-2 text-dark shadow-sm" onclick="openTrendModal()" style="border-radius: 20px; font-size: 0.85rem; background-color: #fbbf24;">📈 出席頻率變化分析</button>
      </div>
    </div>
    
    <div class="row g-2 mt-2">
      <div class="col-12">
        <div class="input-group shadow-sm border-0" style="border-radius: 20px; overflow: hidden;">
          <span class="input-group-text bg-white border-0 px-3">🔍</span>
          <input type="text" id="statsNameSearch" class="form-control border-0 py-2"
                 placeholder="輸入姓名即時過濾（注音/拼音可直接輸入）..."
                 autocomplete="off"
                 oninput="filterStatsTable()"
                 oncompositionend="filterStatsTable()" style="font-size: 0.85rem;">
          <button type="button" class="btn btn-white border-0 text-muted pe-3" id="statsNameClearBtn"
                  style="display:none;"
                  onclick="document.getElementById('statsNameSearch').value=''; filterStatsTable();">✕</button>
        </div>
      </div>
    </div>
  </div>

  <div class="row mb-3 text-center g-2">
    <div class="col-4">
      <div class="stat-card border-0" style="background-color: #ffffff; border-left: 4px solid var(--color-teal) !important;">
        <div class="small text-secondary fw-bold mb-1" id="lblMainStat" style="font-size: 0.8rem;">總場次</div>
        <div class="h4 mb-0 fw-bold" id="valMainStat" style="color: var(--color-teal-hover); font-family: var(--font-sans);">0</div>
      </div>
    </div>
    <div class="col-4">
      <div class="stat-card border-0" style="background-color: #ffffff; border-left: 4px solid var(--color-green) !important;">
        <div class="small text-secondary fw-bold mb-1" style="font-size: 0.8rem;">📋 名單出席</div>
        <div class="h4 mb-1 fw-bold" id="valMemberStat" style="color: var(--color-green); font-family: var(--font-sans);">0</div>
        <div class="d-flex justify-content-center gap-2" style="font-size: 0.75rem;">
          <span class="fw-bold" style="color: #0284c7;">👦 <span id="valMemberMale">0</span></span>
          <span class="fw-bold" style="color: #f43f5e;">👧 <span id="valMemberFemale">0</span></span>
        </div>
      </div>
    </div>
    <div class="col-4">
      <div class="stat-card border-0" style="background-color: #ffffff; border-left: 4px solid var(--color-gold) !important;">
        <div class="small text-secondary fw-bold mb-1" style="font-size: 0.8rem;">👶 新朋友</div>
        <div class="h4 mb-1 fw-bold" id="valNewFriendStat" style="color: var(--color-gold); font-family: var(--font-sans);">0</div>
        <div class="d-flex justify-content-center gap-2" style="font-size: 0.75rem;">
          <span class="fw-bold" style="color: #0284c7;">👦 <span id="valNfMale">0</span></span>
          <span class="fw-bold" style="color: #f43f5e;">👧 <span id="valNfFemale">0</span></span>
        </div>
      </div>
    </div>
  </div>

  <div class="table-responsive border-0 stats-table-container shadow-sm" style="min-height: 500px; background: white; border-radius: var(--radius-lg);">
    <table class="table table-sm table-hover align-middle mb-0">
      <thead class="stats-table-header sticky-top" style="z-index: 10; top: 0;"> 
        <tr class="small text-muted" id="tableHeaderRow">
          <th class="ps-3" style="border-top-left-radius: 8px;">姓名</th>
          <th class="text-center">性別</th>
          <th class="text-center">次數</th>
          <th style="width: 35%; border-top-right-radius: 8px;">出席率</th>
        </tr>
      </thead>
      <tbody id="statsTableBody" class="small">
        <tr><td colspan="4" class="text-center p-5 text-muted">正在載入選單...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 頻率變化分析 Modal -->
<div id="trendModal" class="custom-overlay" style="display:none; align-items:center; justify-content:center;">
  <div class="custom-modal-content" style="max-width:540px; width:95%; margin: 20px auto; max-height:85vh; display:flex; flex-direction:column; overflow:hidden; padding:24px; position:relative;">
    <button type="button" class="btn-close" onclick="closeTrendModal()" style="position:absolute;top:20px;right:20px;z-index:100;" aria-label="Close"></button>
    <h5 class="fw-bold mb-1">📈 出席頻率變化分析</h5>
    <div class="text-secondary small mb-3" id="trendSubtitle"></div>

    <div class="d-flex align-items-center gap-2 mb-3" style="font-size: 0.85rem;">
      <label class="small fw-bold text-secondary mb-0">分析近期週數</label>
      <div class="input-group input-group-sm" style="width:85px;">
        <input type="number" id="trendRecentWeeks" class="form-control border-0 bg-light" value="8" min="3" style="border-radius: 8px 0 0 8px;">
        <span class="input-group-text bg-light border-0" style="border-radius: 0 8px 8px 0;">週</span>
      </div>
      <button class="btn btn-sm btn-primary fw-bold border-0 ms-2" onclick="runTrendAnalysis()" style="border-radius: 20px; background-color: var(--color-teal);">重新分析</button>
    </div>

    <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
      <label class="small fw-bold text-secondary mb-0">衰退幅度門檻</label>
      <div class="input-group input-group-sm" style="width:90px;">
        <input type="number" id="trendDropThreshold" class="form-control border-0 bg-light" value="20" min="1" max="100" style="border-radius: 8px 0 0 8px;">
        <span class="input-group-text bg-light border-0" style="border-radius: 0 8px 8px 0;">%</span>
      </div>
      <button class="btn btn-sm btn-light border-0 fw-bold px-3 ms-2" onclick="applyTrendFilter()" style="border-radius: 20px; color: var(--text-secondary);">重新篩選</button>
      <button class="btn btn-sm btn-success border-0 fw-bold ms-auto px-3" onclick="exportTrendCSV()" style="border-radius: 20px; background-color: var(--color-green);">📥 匯出 Excel</button>
    </div>

    <div id="trendLoading" style="display:none;" class="text-center py-4">
      <div class="water-ripple mb-2"><div></div><div></div></div>
      <div class="small text-secondary mt-2">演算法分析中...</div>
    </div>
    <div id="trendResult" style="flex:1; overflow-y:auto;"></div>
  </div>
</div>

<script src="STATS.js"></script>
