<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>⛪ 教會主日出席點名系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css?v=20260831_v3_fast">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="../../manifest.json">
  <style>
    :root {
      --font-sans: 'Plus Jakarta Sans', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      --bg-primary: #f0f7f9; /* Pale crystalline water blue-white */
      --bg-card: #ffffff;
      --text-primary: #0f2a35; /* Deep ocean teal */
      --text-secondary: #3b525e; /* Soft water gray */
      --color-teal: #06b6d4; /* Translucent spring cyan */
      --color-teal-hover: #0891b2;
      --color-green: #10b981; /* Water drop green */
      --color-gold: #f59e0b; /* Sunshine gold */
      --color-rose: #f43f5e; /* Coral rose */
      --border-color: #e2e8f0;
      --shadow-soft: 0 10px 30px rgba(15, 42, 53, 0.04);
      --shadow-hover: 0 20px 40px rgba(15, 42, 53, 0.08);
      --radius-lg: 16px;
      --radius-md: 12px;
    }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.03) 0px, transparent 50%);
      background-attachment: fixed;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      padding: 15px;
      margin-right: auto;
      margin-left: auto;
      transition: max-width 0.3s ease;
    }
    #main-nav {
      max-width: 550px;
      margin: 0 auto;
    }
    .nav-card { 
      cursor: pointer; 
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
      height: 96px; 
      display: flex; 
      flex-direction: row !important; 
      align-items: center; 
      justify-content: flex-start; 
      font-weight: 600; 
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.3) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px 0 rgba(15, 42, 53, 0.02);
      padding: 0 48px 0 24px; 
      position: relative;
      overflow: hidden;
    }
    .nav-card-body {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      max-width: 260px; 
      margin: 0 auto;
      text-align: left;
      padding-left: 12px;
      box-sizing: border-box;
    }
    /* Flowing glass shimmer effect */
    .nav-card::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(
        90deg, 
        rgba(255, 255, 255, 0) 0%, 
        rgba(255, 255, 255, 0.35) 50%, 
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-25deg);
      transition: none;
      pointer-events: none;
    }
    .nav-card:hover::after {
      left: 150%;
      transition: all 0.85s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-card::before {
      content: '';
      position: absolute;
      top: 24px; left: 0; 
      width: 4px; height: 48px;
      background: var(--theme-color);
      border-radius: 0 4px 4px 0;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-card:hover { 
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.55) 100%); 
      transform: translateY(-4px); 
      box-shadow: 
        0 20px 40px rgba(15, 42, 53, 0.05), 
        0 0 0 1px color-mix(in srgb, var(--theme-color) 12%, transparent);
      border-color: rgba(255, 255, 255, 0.7);
    }
    .nav-card:hover::before {
      top: 16px;
      height: 64px;
      box-shadow: 0 0 16px var(--theme-color);
    }
    .nav-icon-wrapper {
      margin-right: 18px;
      font-size: 1.8rem;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-card:hover .nav-icon-wrapper {
      transform: scale(1.18) rotate(5deg);
    }
    .nav-text-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .nav-text { 
      font-size: 1.05rem; 
      font-weight: 700;
      color: var(--text-primary); 
      letter-spacing: -0.2px;
    }
    .nav-subtitle {
      font-size: 0.68rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 600;
      color: var(--text-secondary);
      opacity: 0.7;
    }
    .nav-arrow { 
      font-size: 1.3rem; 
      opacity: 0.25; 
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
      color: var(--text-secondary); 
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
    }
    .nav-card:hover .nav-arrow { 
      opacity: 1; 
      transform: translateX(4px) translateY(-50%); 
      color: var(--theme-color); 
    }
    
    .custom-overlay, .custom-modal-backdrop {
      display: none; 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(15, 42, 53, 0.4); 
      backdrop-filter: blur(4px);
      z-index: 9999; 
      overflow-y: auto;
    }
    body.modal-open {
      overflow: hidden !important;
      height: 100vh !important;
    }
    .custom-modal-content {
      background: white;
      padding: 24px;
      border-radius: var(--radius-lg);
      margin: 20px auto;
      width: 95%;
      max-width: calc(100% - 16px);
      box-sizing: border-box;
      box-shadow: 0 20px 50px rgba(15, 42, 53, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    /* Water drop ripple spinner */
    .water-ripple {
      display: inline-block;
      position: relative;
      width: 80px;
      height: 80px;
    }
    .water-ripple div {
      position: absolute;
      border: 4px solid var(--color-teal);
      opacity: 1;
      border-radius: 50%;
      animation: water-ripple 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }
    .water-ripple div:nth-child(2) {
      animation-delay: -0.5s;
    }
    @keyframes water-ripple {
      0% {
        top: 36px; left: 36px; width: 0; height: 0; opacity: 1;
      }
      100% {
        top: 0px; left: 0px; width: 72px; height: 72px; opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <div id="main-nav">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0 text-dark" style="font-size: 1.6rem; letter-spacing: -0.5px;">⛪ 主日出席點名系統</h2>
        <a href="https://www.canva.com/design/DAHCGu-ynJs/eI1qlAREHLG-vLxNELzXxg/view?utm_content=DAHCGu-ynJs&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h30d97a479b" 
           target="_blank" 
           class="text-secondary text-decoration-none border-bottom border-secondary pb-0" 
           style="font-size: 0.85rem;" title="查看系統操作說明">
           📖 操作說明
        </a>
      </div>
      
      <div class="card nav-card mb-3" onclick="loadAttendancePage('台語')" style="--theme-color: var(--color-teal);">
        <div class="nav-card-body">
          <div class="nav-icon-wrapper">🎤</div>
          <div class="nav-text-group">
            <span class="nav-text">主日點名系統</span>
            <span class="nav-subtitle">Sunday Attendance Roll Call</span>
          </div>
        </div>
        <span class="nav-arrow">→</span>
      </div>
      
      
      <div class="card nav-card mb-3" onclick="loadPage('MEMBERS')" style="--theme-color: var(--color-green);">
        <div class="nav-card-body">
          <div class="nav-icon-wrapper">👥</div>
          <div class="nav-text-group">
            <span class="nav-text">會友名單管理</span>
            <span class="nav-subtitle">Member Directory Management</span>
          </div>
        </div>
        <span class="nav-arrow">→</span>
      </div>
      
      <div class="card nav-card mb-3" onclick="loadPage('STATS')" style="--theme-color: var(--color-gold);">
        <div class="nav-card-body">
          <div class="nav-icon-wrapper">📊</div>
          <div class="nav-text-group">
            <span class="nav-text">出席統計查詢</span>
            <span class="nav-subtitle">Attendance Statistics</span>
          </div>
        </div>
        <span class="nav-arrow">→</span>
      </div>

      <div class="card nav-card mb-3" onclick="loadPage('TREND_CHART')" style="--theme-color: var(--color-rose);">
        <div class="nav-card-body">
          <div class="nav-icon-wrapper">📈</div>
          <div class="nav-text-group">
            <span class="nav-text">趨勢分析圖表</span>
            <span class="nav-subtitle">Attendance Trend Charts</span>
          </div>
        </div>
        <span class="nav-arrow">→</span>
      </div>

      <div class="card nav-card mb-3" onclick="loadPage('AGM_ATTENDANCE')" style="--theme-color: #6366f1;">
        <div class="nav-card-body">
          <div class="nav-icon-wrapper">🏛️</div>
          <div class="nav-text-group">
            <span class="nav-text">會員大會點名系統</span>
            <span class="nav-subtitle">AGM Roll Call (6 Categories)</span>
          </div>
        </div>
        <span class="nav-arrow">→</span>
      </div>

      <div class="card nav-card mb-3" onclick="loadPage('AGM_VIEWER')" style="--theme-color: var(--color-green);">
        <div class="nav-card-body">
          <div class="nav-icon-wrapper">📺</div>
          <div class="nav-text-group">
            <span class="nav-text">會員大會即時觀看</span>
            <span class="nav-subtitle">Read-only Live Viewer</span>
          </div>
        </div>
        <span class="nav-arrow">→</span>
      </div>
    </div>

    <div id="content-area" style="display:none;">
      <button class="btn btn-outline-secondary mb-3 shadow-sm" onclick="showHome()">← 回主選單</button>
      
      <div id="page-ATTENDANCE" class="page-section"></div>
      <div id="page-AGM_ATTENDANCE" class="page-section"></div>
      <div id="page-AGM_VIEWER" class="page-section"></div>
      <div id="page-MEMBERS" class="page-section"></div>
      <div id="page-STATS" class="page-section"></div>
      <div id="page-TREND_CHART" class="page-section"></div>
    </div>

  </div>

  <!-- 設定檔與 API 橋接層 -->
  <script>window._GAS_KEY = 'LKC_SundayserviceAttendance_TEST';</script>
  <script src="../../config.js"></script>
  <script src="config.js"></script>
  <!-- ⚡ Supabase 熱響應服務模組 (<50ms) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../supabase/supabase-config.js"></script>
  <script src="attendance-supabase.js?v=20260913_stats_count_fix"></script>
  <script src="api.js?v=20260913_stats_count_fix"></script>
  <script src="list-scroll-anchor.js"></script>
  <script src="attendance-search-scroll.js"></script>

<script>
  var autoJumpConfig = { cat: null, grp: null, active: false };
  var pageLoaded = { ATTENDANCE: false, AGM_ATTENDANCE: false, AGM_VIEWER: false, MEMBERS: false, STATS: false, TREND_CHART: false };
  var _appVer = '20260913_stats_count_fix';

  /**
   * 動態載入子頁面 HTML
   * ✅ 已修改：拿掉 pages/ 前綴，直接從根目錄讀取
   */
  async function loadPageContent(pageId, filename) {
    if (pageLoaded[pageId]) return;
    const container = document.getElementById('page-' + pageId);
    container.innerHTML = '<div id="page-loading" class="d-flex flex-column align-items-center justify-content-center py-5"><div class="water-ripple mb-3"><div></div><div></div></div><div class="fw-bold" style="color: var(--text-secondary);">清泉流淌中...</div></div>';
    try {
      const res = await fetch(filename + '.html?v=' + _appVer);
      if (!res.ok) throw new Error('找不到 ' + filename + '.html');
      container.innerHTML = await res.text();
      pageLoaded[pageId] = true;

      const scripts = Array.from(container.querySelectorAll('script'));
      for (let i = 0; i < scripts.length; i++) {
        const oldScript = scripts[i];
        await new Promise((resolve) => {
          const newScript = document.createElement('script');
          if (oldScript.src) {
            const separator = oldScript.src.includes('?') ? '&' : '?';
            if (!oldScript.src.startsWith('http') || oldScript.src.startsWith(window.location.origin) || oldScript.src.includes('localhost') || oldScript.src.includes('127.0.0.1')) {
              newScript.src = oldScript.src + separator + 'v=' + _appVer;
            } else {
              newScript.src = oldScript.src;
            }
            newScript.onload = () => resolve();
            newScript.onerror = () => resolve();
          } else {
            newScript.textContent = oldScript.textContent;
            resolve();
          }
          document.body.appendChild(newScript);
          oldScript.remove();
          if (!oldScript.src) resolve();
        });
      }
    } catch (e) {
      container.innerHTML = '<div class="alert alert-danger m-3">❌ 頁面載入失敗：' + e.message + '</div>';
    }
  }

  function prepareContentArea() {
    document.getElementById('main-nav').style.display = 'none';
    document.getElementById('content-area').style.display = 'block';
    document.querySelectorAll('.page-section').forEach(sec => sec.style.display = 'none');
  }

  function cleanUrlParams() {
    try {
      if (window.history && window.history.replaceState) {
        const url = new URL(window.location.href);
        if (url.searchParams.has('cat') || url.searchParams.has('grp') || url.searchParams.has('agmSession') || url.searchParams.has('agmRole') || url.searchParams.has('agmViewer')) {
          url.searchParams.delete('cat');
          url.searchParams.delete('grp');
          url.searchParams.delete('agmSession');
          url.searchParams.delete('agmRole');
          url.searchParams.delete('agmViewer');
          window.history.replaceState({}, document.title, url.pathname + url.search);
          console.log("🧹已清除網址參數以防止重複導向");
        }
      }
    } catch (e) {
      console.warn("Unable to clear URL params:", e);
    }
  }

  function showHome() {
    if (typeof stopScanning === "function") stopScanning();
     if (typeof stopAutoSync === "function") stopAutoSync();
     if (typeof stopAgmCheckinPolling === "function") stopAgmCheckinPolling();
     if (typeof stopAgmViewerPolling === "function") stopAgmViewerPolling();
    document.getElementById('main-nav').style.display = 'block';
     document.getElementById('content-area').style.display = 'none';
     autoJumpConfig.active = false;
     window.AGM_ENTRY_SESSION_ID = '';
     cleanUrlParams();
  }

  async function loadAttendancePage(type) {
    prepareContentArea();
    document.getElementById('page-ATTENDANCE').style.display = 'block';
    await loadPageContent('ATTENDANCE', 'attendance');
    if (typeof initAttendancePage === "function") initAttendancePage(type);
  }

  async function loadPage(pageId) {
    prepareContentArea();
    cleanUrlParams();
    const target = document.getElementById('page-' + pageId);
    if (!target) return;
    target.style.display = 'block';

    const fileMap = { MEMBERS: 'members', STATS: 'STATS', TREND_CHART: 'Chart', AGM_ATTENDANCE: 'agm_attendance', AGM_VIEWER: 'agm_viewer' };
    await loadPageContent(pageId, fileMap[pageId]);

    if (pageId === 'MEMBERS' && typeof refreshMemberTable === "function") refreshMemberTable();
    if (pageId === 'AGM_ATTENDANCE' && typeof initAgmAttendancePage === "function") initAgmAttendancePage();
    if (pageId === 'AGM_VIEWER' && typeof initAgmViewerPage === "function") initAgmViewerPage();
    if (pageId === 'STATS') {
      if (typeof initStatsPage === "function") initStatsPage();
      else if (typeof fetchStatsData === "function") fetchStatsData();
    }
    if (pageId === 'TREND_CHART') {
      const groupNameEl = document.getElementById('chartGroupName');
      if (groupNameEl) groupNameEl.innerText = (typeof currentAttType !== 'undefined' && currentAttType) ? currentAttType : "尚未選擇";
      if (typeof loadChartData === "function") loadChartData();
    }
  }

  window.onload = function() {
    if (typeof initializeApp === "function") initializeApp();

    const params = new URLSearchParams(window.location.search);
    const initCat = params.get('cat');
    const initGrp = params.get('grp');
    const agmSession = params.get('agmSession');
    const agmRole = params.get('agmRole');
    const openAgmViewer = params.get('agmViewer') === '1' || agmRole === 'viewer';

    if (agmSession || openAgmViewer) {
      window.AGM_ENTRY_SESSION_ID = agmSession || '';
      window.AGM_ENTRY_ROLE = agmRole || (agmSession ? 'scanner' : '');
      prepareContentArea();
      const targetPage = openAgmViewer ? 'AGM_VIEWER' : 'AGM_ATTENDANCE';
      document.getElementById('page-' + targetPage).style.display = 'block';
      loadPageContent(targetPage, targetPage === 'AGM_VIEWER' ? 'agm_viewer' : 'agm_attendance')
        .then(function() {
          if (targetPage === 'AGM_VIEWER' && typeof initAgmViewerPage === 'function') initAgmViewerPage();
          if (targetPage === 'AGM_ATTENDANCE' && typeof initAgmAttendancePage === 'function') initAgmAttendancePage();
        });
    }

    if (!agmSession && !openAgmViewer && initCat && initGrp) {
      console.log("🚀 偵測到跳轉指令：", initCat, initGrp);
      autoJumpConfig.cat = initCat;
      autoJumpConfig.grp = initGrp;
      autoJumpConfig.active = true;

      prepareContentArea();
      document.getElementById('page-ATTENDANCE').style.display = 'block';

      loadPageContent('ATTENDANCE', 'attendance');
    }

    function syncModalScrollLock() {
      var overlays = document.querySelectorAll('.custom-overlay, .custom-modal-backdrop, .modal');
      var anyVisible = false;
      for (var i = 0; i < overlays.length; i++) {
        var el = overlays[i];
        if (el.classList.contains('show') || (el.style && el.style.display !== 'none' && el.style.display !== '')) {
          anyVisible = true;
          break;
        }
      }
      document.body.classList.toggle('modal-open', anyVisible);
    }
    document.addEventListener('show.bs.modal', function() { document.body.classList.add('modal-open'); });
    document.addEventListener('hidden.bs.modal', function() { syncModalScrollLock(); });
    window.syncModalScrollLock = syncModalScrollLock;
  };
</script>
</body>
</html>
