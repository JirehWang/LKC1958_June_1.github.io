<script type="module" src="../../firebase/observability-browser.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<div class="card p-3 shadow-sm border-0" style="background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(8px); border-radius: var(--radius-lg);">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-3">
    <h4 class="fw-bold mb-0 text-dark d-flex align-items-center" style="font-size: 1.3rem; letter-spacing: -0.3px;">
      <span class="fs-3 me-2">📈</span> 聚會趨勢深度分析
    </h4>
    <div class="btn-group shadow-sm" role="group" style="border-radius: 20px; overflow: hidden; border: 1px solid var(--border-color);">
      <input type="radio" class="btn-check" name="chartCat" id="catWorship" autocomplete="off" checked onclick="loadCategoryChart('禮拜')">
      <label class="btn btn-light px-4 border-0 fw-bold" for="catWorship" style="font-size: 0.85rem; padding: 8px 16px;">⛪ 禮拜</label>
      <input type="radio" class="btn-check" name="chartCat" id="catSundaySchool" autocomplete="off" onclick="loadCategoryChart('主日學')">
      <label class="btn btn-light px-4 border-0 fw-bold" for="catSundaySchool" style="font-size: 0.85rem; padding: 8px 16px;">📖 主日學</label>
    </div>
  </div>

  <div class="row g-2 mb-3 bg-white p-3 rounded-4 shadow-sm border-0" style="border-radius: var(--radius-lg);">
    <div class="col-md-3 col-6">
      <label class="form-label small fw-bold text-secondary mb-1">📅 開始日期</label>
      <input type="date" id="chartStartDate" class="form-control border-0 bg-light py-2 text-secondary fw-bold" style="border-radius: 8px; font-size: 0.85rem;">
    </div>
    <div class="col-md-3 col-6">
      <label class="form-label small fw-bold text-secondary mb-1">📅 結束日期</label>
      <input type="date" id="chartEndDate" class="form-control border-0 bg-light py-2 text-secondary fw-bold" style="border-radius: 8px; font-size: 0.85rem;">
    </div>
    <div class="col-md-6 col-12 d-flex gap-2 align-items-end mt-2 mt-md-0">
      <button class="btn btn-primary fw-bold flex-grow-1 border-0 py-2 shadow-sm" onclick="refreshCurrentChart()" style="border-radius: 20px; font-size: 0.85rem; background-color: var(--color-teal);">🔍 篩選區間</button>
      <button class="btn btn-success fw-bold border-0 py-2 shadow-sm" onclick="exportToExcel()" title="匯出 Excel 數據" style="border-radius: 20px; font-size: 0.85rem; background-color: var(--color-green);">📥 匯出 Excel</button>
      <button class="btn btn-light border-0 fw-bold py-2 shadow-sm text-secondary" onclick="downloadChartImage()" title="下載圖表圖片" style="border-radius: 20px; font-size: 0.85rem;">🖼️ 圖表</button>
    </div>
  </div>
  
  <div class="d-flex justify-content-between align-items-center mb-2">
    <div class="text-secondary small fw-bold" id="chartStatusText">資料讀取中...</div>
    <button class="btn btn-sm btn-light border-0 fw-bold text-secondary shadow-sm px-3 py-1.5" id="refreshChartBtn" onclick="refreshCurrentChart()" style="border-radius: 20px; font-size: 0.8rem;">
      🔄 重新整理
    </button>
  </div>
  
  <div class="bg-white p-3 border-0 shadow-sm" style="position: relative; height: 60vh; width: 100%; border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
    <canvas id="attendanceChart"></canvas>
  </div>
</div>

<script>
  var attendanceChartInstance = null; 
  var activeCategory = '禮拜'; 
  var lastFetchedData = null; 

  var colorPalette = [
    { border: '#06b6d4', bg: 'rgba(6, 182, 212, 0.1)' },   /* Spring Cyan */
    { border: '#10b981', bg: 'rgba(16, 185, 129, 0.1)' },   /* Leaf Green */
    { border: '#f59e0b', bg: 'rgba(245, 158, 11, 0.1)' },   /* Sunshine Gold */
    { border: '#f43f5e', bg: 'rgba(244, 63, 94, 0.1)' },    /* Coral Rose */
    { border: '#6366f1', bg: 'rgba(99, 102, 241, 0.1)' }    /* Indigo Water */
  ];

  function refreshCurrentChart() { loadCategoryChart(activeCategory); }

  function loadCategoryChart(category) {
    activeCategory = category; 
    const startDate = document.getElementById('chartStartDate').value;
    const endDate = document.getElementById('chartEndDate').value;
    const statusText = document.getElementById('chartStatusText');
    const refreshBtn = document.getElementById('refreshChartBtn');
    statusText.innerHTML = `正在分析 <b class="text-primary">${category}</b> 數據... <span class="spinner-border spinner-border-sm text-primary"></span>`;
    refreshBtn.disabled = true;
    google.script.run
      .withSuccessHandler(function(response) {
        refreshBtn.disabled = false;
        if (response.error) {
          statusText.innerHTML = `<span class="text-danger">${response.error}</span>`;
          if (attendanceChartInstance) attendanceChartInstance.destroy();
          return;
        }
        lastFetchedData = response;
        statusText.innerHTML = `✅ 已載入 <b class="text-primary">${category}</b> 紀錄共 ${response.labels.length} 筆`;
        renderComboChart(response);
      })
      .withFailureHandler(function(err) {
        refreshBtn.disabled = false;
        statusText.innerHTML = `<span class="text-danger">❌ 載入失敗：${err.message}</span>`;
      })
      .getCategoryChartData(category, startDate, endDate);
  }

  function ensureChartJSReady() {
    if (window.Chart) return Promise.resolve(window.Chart);
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/chart.js';
      s.onload = () => resolve(window.Chart);
      s.onerror = () => reject(new Error('無法載入 Chart.js 模組'));
      document.head.appendChild(s);
    });
  }

  async function renderComboChart(data) {
    await ensureChartJSReady();
    const canvas = document.getElementById('attendanceChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (attendanceChartInstance) attendanceChartInstance.destroy();
    const chartDatasets = [];
    chartDatasets.push({
        type: 'bar', label: '正式會友 (總計)',
        data: data.datasets['MembersTotal'],
        backgroundColor: 'rgba(59, 82, 94, 0.4)', borderColor: '#3b525e',
        borderWidth: 1, borderRadius: 6, yAxisID: 'y', stack: 'combined', order: 2
    });
    chartDatasets.push({
        type: 'bar', label: '新朋友 (總計)',
        data: data.datasets['NewFriendsTotal'],
        backgroundColor: 'rgba(244, 63, 94, 0.4)', borderColor: '#f43f5e',
        borderWidth: 1, borderRadius: 6, yAxisID: 'y', stack: 'combined', order: 2
    });
    data.groups.forEach((groupName, index) => {
        const colors = colorPalette[index % colorPalette.length];
        chartDatasets.push({
            type: 'line', label: groupName,
            data: data.datasets[groupName],
            borderColor: colors.border, backgroundColor: colors.border,
            borderWidth: 3, tension: 0.4,
            pointBackgroundColor: '#ffffff', pointBorderWidth: 2, pointRadius: 4,
            fill: false, yAxisID: 'yLine', order: 1
        });
    });
    attendanceChartInstance = new Chart(ctx, {
        data: { labels: data.labels, datasets: chartDatasets },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top', labels: { usePointStyle: true, font: { weight: 'bold', family: "'Plus Jakarta Sans', 'Noto Sans TC'" } } },
                tooltip: {
                    callbacks: {
                        footer: function(tooltipItems) {
                            let sum = 0;
                            tooltipItems.forEach(function(item) { if (item.dataset.type === 'bar') sum += item.parsed.y; });
                            return '實到總計: ' + sum + ' 人';
                        }
                    }
                }
            },
            scales: {
                x: { stacked: true, grid: { display: false } },
                y: { type: 'linear', display: true, position: 'left', stacked: true, beginAtZero: true,
                     title: { display: true, text: '出席人數', font: { weight: 'bold' } },
                     grid: { color: 'rgba(15, 42, 53, 0.05)', borderDash: [5, 5] } },
                yLine: { type: 'linear', display: false, stacked: false, beginAtZero: true,
                         afterDataLimits: (axis) => { const masterMax = axis.chart.scales.y.max; axis.max = masterMax; axis.min = 0; } }
            }
        }
    });
  }

  function exportToExcel() {
    if (!lastFetchedData) return alert("目前沒有數據可以匯出！");
    const rows = [];
    const headers = ["日期", "正式會友總計", "新朋友總計", "當日總人數", ...lastFetchedData.groups];
    rows.push(headers);
    lastFetchedData.labels.forEach((date, i) => {
      const mCount = lastFetchedData.datasets["MembersTotal"][i];
      const nfCount = lastFetchedData.datasets["NewFriendsTotal"][i];
      const row = [date, mCount, nfCount, (mCount + nfCount)];
      lastFetchedData.groups.forEach(group => { row.push(lastFetchedData.datasets[group][i]); });
      rows.push(row);
    });
    const worksheet = XLSX.utils.aoa_to_sheet(rows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, activeCategory + "數據分析");
    const fileName = `教會出席統計_${activeCategory}_${new Date().toLocaleDateString().replace(/\//g, '-')}.xlsx`;
    XLSX.writeFile(workbook, fileName);
  }

  function downloadChartImage() {
    const canvas = document.getElementById('attendanceChart');
    const link = document.createElement('a');
    link.download = `趨勢圖_${activeCategory}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  function loadChartData() { loadCategoryChart(activeCategory); }

  // 頁面載入時自動執行
  loadChartData();
</script>
