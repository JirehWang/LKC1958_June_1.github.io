<script type="module" src="../../firebase/observability-browser.js"></script>
<style>
  /* 通用適應性排版 - 所有螢幕寬度自動適應 */
  .attendance-scroll-area {
    height: calc(100vh - 275px);
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(4px);
    padding: clamp(8px, 2%, 16px);
    overflow-y: auto;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-color);
    box-sizing: border-box;
    box-shadow: inset 0 2px 8px rgba(15, 42, 53, 0.02);
  }
  
  #attendanceListBody {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(22%, 72px), 1fr));
    gap: 8px;
  }

  .att-item {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: clamp(2px, 1%, 4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    height: clamp(62px, 15vw, 85px);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    box-shadow: 0 2px 6px rgba(15, 42, 53, 0.02);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .att-item:active { transform: scale(0.95); }
  
  .att-name {
    font-size: clamp(0.85rem, 2.5vw, 1.05rem);
    font-weight: 600;
    color: var(--text-primary);
    text-align: center;
    line-height: 1.2;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .att-info {
    font-size: clamp(0.7rem, 1.5vw, 0.85rem);
    margin-top: clamp(1px, 0.5%, 2px);
  }

  .att-item input[type="checkbox"] {
    width: clamp(12px, 3vw, 16px);
    height: clamp(12px, 3vw, 16px);
    margin-bottom: clamp(2px, 0.5%, 4px);
    pointer-events: none;
  }

  /* Selected: Water blue-cyan theme */
  .att-item.selected { 
    background: linear-gradient(135deg, var(--color-teal), var(--color-teal-hover)) !important; 
    color: white !important; 
    border-color: transparent;
    box-shadow: 0 6px 16px rgba(6, 182, 212, 0.3);
  }
  .att-item.selected .att-name { color: white !important; }
  .att-item.selected .att-info, .att-item.selected .gender-text { color: rgba(255, 255, 255, 0.85) !important; }

  /* Pending source: manual keeps the existing teal, QR uses the app's deep-blue accent. */
  .att-item.pending-manual { border-color: var(--color-teal-hover); }
  .att-item.pending-qr {
    background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
    border-color: transparent !important;
    color: white !important;
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.24);
  }
  .att-item.pending-qr .att-name,
  .att-item.pending-qr .att-info,
  .att-item.pending-qr .gender-text { color: white !important; }
  .att-item.pending-manual::after,
  .att-item.pending-qr::after {
    content: "手動";
    position: absolute;
    top: 2px;
    right: 5px;
    font-size: clamp(8px, 1.5vw, 11px);
    font-weight: 800;
    opacity: 0.8;
  }
  .att-item.pending-qr::after { content: "QR"; }
  .att-item.locked.pending-manual::after { content: "🔒 手動"; }
  .att-item.locked.pending-qr::after { content: "🔒 QR"; }
  
  /* Submitted: Crystalline soft green theme */
  .att-item.submitted { 
    background-color: #d1fae5 !important; 
    border-color: #34d399 !important; 
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.08);
  }
  .att-item.submitted .att-name { color: #065f46 !important; }
  .att-item.submitted::after { 
    content: "✓"; 
    position: absolute; 
    top: 2px; 
    right: 6px; 
    color: var(--color-green); 
    font-weight: 700; 
    font-size: clamp(10px, 2vw, 14px); 
  }
  
  /* Locked: Greyed out sage/slate theme */
  .att-item.locked { 
    background-color: #f1f5f9 !important; 
    border-color: #e2e8f0 !important; 
    cursor: not-allowed !important; 
    opacity: 0.5; 
  }
  .att-item.locked::after { 
    content: "🔒"; 
    position: absolute; 
    top: 2px; 
    right: 6px; 
    font-size: clamp(8px, 1.5vw, 12px); 
    opacity: 0.4; 
  }
  
  .full-width-msg { 
    grid-column: 1 / -1; 
    text-align: center; 
    padding: clamp(30px, 5%, 60px) clamp(10px, 2%, 20px); 
    color: var(--text-secondary); 
    width: 100%; 
  }
  
  .custom-overlay { 
    display:none; 
    position:fixed; 
    top:0; left:0; 
    width:100%; height:100%; 
    background: rgba(15, 42, 53, 0.4); 
    backdrop-filter: blur(4px);
    z-index:9999; 
    overflow-y: auto; 
  }
  
  .custom-modal-content { 
    background: white; 
    margin: clamp(20px, 5%, 40px) auto; 
    padding: clamp(20px, 4%, 30px); 
    width: min(90%, 500px); 
    border-radius: var(--radius-lg); 
    box-shadow: 0 20px 50px rgba(15, 42, 53, 0.15); 
    position: relative; 
    text-align: left; 
    box-sizing: border-box; 
    border: 1px solid rgba(255, 255, 255, 0.5);
  }
  
  /* Pulsing animation for sleep indicator */
  .sleep-pulse {
    animation: sleep-glow 2s infinite ease-in-out;
  }
  @keyframes sleep-glow {
    0%, 100% { opacity: 0.8; box-shadow: 0 0 5px rgba(99, 102, 241, 0.2); }
    50% { opacity: 1; box-shadow: 0 0 15px rgba(99, 102, 241, 0.6); }
  }
</style>

<div class="mb-3 p-3 bg-white border-0 shadow-sm" style="border-radius: var(--radius-lg);">
  <div class="d-flex justify-content-between align-items-center">
    <span class="fw-bold text-dark d-flex align-items-center" style="font-size: 0.95rem;">
      <span class="me-2">📷</span> QR Code 快速報到
    </span>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-light border-0 fw-bold px-3 py-1.5" onclick="triggerVenueDownload()" title="下載目前選定場次的自動跳轉卡" style="border-radius: 20px; font-size: 0.8rem; color: var(--text-secondary);">
        📥 下載場次 QR
      </button>
      <button id="scanBtn" class="btn btn-sm btn-primary border-0 fw-bold px-3 py-1.5" onclick="toggleScanner()" style="border-radius: 20px; font-size: 0.8rem; background-color: var(--color-teal);">開啟相機</button>
    </div>
  </div>
  <div id="reader" class="mt-2" style="display: none; width: 100%; border-radius: var(--radius-md); overflow: hidden;"></div>
</div>

<div class="card p-3 shadow-sm border-0" style="background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(8px); border-radius: var(--radius-lg);">
  <!-- 鎖定模式 Banner -->
  <div id="lockModeBanner" class="alert alert-warning py-2 px-3 mb-3 fw-bold text-center" style="display: none; border-radius: var(--radius-md); background-color: rgba(245, 158, 11, 0.1); border: 0; color: var(--color-gold);">
    🔒 鎖定點名場次：<span id="lockModeText"></span>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0 fw-bold text-dark" style="font-size: 1.3rem; letter-spacing: -0.3px;">🎤 點名系統</h4>
    <button id="btnGroupAdd" class="btn btn-sm btn-light border-0 fw-bold px-3 shadow-sm" onclick="openGroupAddModal()" style="border-radius: 20px; font-size: 0.8rem; color: var(--text-secondary);">
    ➕ 新增群組
    </button>
  </div>
  
  <div class="d-flex justify-content-between gap-2 mb-3">
    <div id="presentCountBadge" class="badge p-2.5 small shadow-sm d-flex align-items-center flex-grow-1 justify-content-center border-0" style="background-color: var(--color-green); border-radius: 20px; font-weight: 600;">
        ✅ 已出席：<span id="presentCount" class="mx-1">0</span> 人
    </div>
    <div class="d-flex align-items-center gap-1 flex-grow-1 justify-content-center badge bg-white text-dark border-0 p-1 small shadow-sm" style="border-radius: 20px;">
      <span>📅</span>
      <input type="date" id="attendanceDateInput" class="form-control form-control-sm p-0 border-0 fw-bold text-dark bg-transparent text-center" style="width: 105px; cursor: pointer; font-size: 0.875rem;" disabled>
      <button id="unlockDateBtn" class="btn btn-xs btn-outline-secondary border-0 p-0 px-1" style="font-size: 0.75rem; line-height: 1;" onclick="unlockDateEdit()" title="修改日期">✏️</button>
    </div>
  </div>

  <div id="groupSelectRow" class="row g-2 mb-3 bg-white p-3 rounded-4 shadow-sm border-0" style="border-radius: var(--radius-lg);">
    <div class="col-5">
      <label class="small text-secondary fw-bold mb-1">📂 點名類別</label>
      <select id="categorySelect" class="form-select form-select-sm fw-bold border-0 bg-light py-2" onchange="updateGroupSelect()" style="border-radius: 10px; color: var(--text-primary);">
        <option value="" disabled selected>載入中...</option>
      </select>
    </div>
    <div class="col-7">
      <label class="small text-secondary fw-bold mb-1">📌 選擇群組</label>
      <select id="groupSelect" class="form-select form-select-sm fw-bold border-0 bg-light py-2 text-primary" onchange="handleGroupSelect()" style="border-radius: 10px; color: var(--color-teal) !important;">
        <option value="" disabled selected>載入中...</option>
      </select>
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-12">
      <div class="input-group shadow-sm" style="border-radius: var(--radius-md); overflow: hidden; border: 0;">
        <span class="input-group-text bg-white border-0 text-muted px-3">🔍</span>
        <input type="text" id="attSearchInput" class="form-control border-0 py-2.5" placeholder="搜尋姓名..." oninput="filterAttList()" style="font-size: 0.95rem;">
        <button class="btn btn-primary border-0 fw-bold px-4" onclick="openAttendanceAddModal()" style="background-color: var(--color-teal);">➕ 新增會友</button>
      </div>
    </div>
  </div>

  <div class="attendance-scroll-area">
    <div id="attendanceListBody"></div>
  </div>

  <div class="d-flex align-items-center gap-3 mt-3">
    <div class="d-flex flex-column gap-2" style="width: 170px; flex-shrink: 0;">
      <div class="input-group input-group-sm shadow-sm border-0 rounded-3 overflow-hidden" style="border-radius: 12px !important;">
        <span class="input-group-text bg-white text-primary border-0 fw-bold small px-3" style="width: 90px; background-color: rgba(6, 182, 212, 0.05) !important;">👦 新(男)</span>
        <input type="number" id="newFriendsMale" class="form-control border-0 text-center fw-bold px-1" value="0" min="0" style="background-color: #ffffff;">
      </div>
      <div class="input-group input-group-sm shadow-sm border-0 rounded-3 overflow-hidden" style="border-radius: 12px !important;">
        <span class="input-group-text bg-white text-danger border-0 fw-bold small px-3" style="width: 90px; background-color: rgba(244, 63, 94, 0.05) !important;">👧 新(女)</span>
        <input type="number" id="newFriendsFemale" class="form-control border-0 text-center fw-bold px-1" value="0" min="0" style="background-color: #ffffff;">
      </div>
    </div>
    <button id="submitBtn" class="btn btn-lg shadow-sm fw-bold flex-grow-1 py-2 border-0" onclick="submitAttendance()" style="font-size: 1.1rem; min-height: 72px; border-radius: 16px; background: linear-gradient(135deg, var(--color-green), #059669); color: white; transition: all 0.3s;">
      確認送出
    </button>
  </div>
</div>

<!-- 新增群組 Modal -->
<div id="groupAddModal" class="custom-overlay">
  <div class="custom-modal-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0 text-dark">➕ 新增點名群組</h5>
      <button type="button" class="btn-close" onclick="closeGroupAddModal()"></button>
    </div>
    <hr style="opacity: 0.1;">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label fw-bold small text-secondary">所屬類別</label>

      </div>
      <div class="col-12">
        <label class="form-label fw-bold small text-secondary">群組名稱</label>
        <input type="text" id="newGroupName" class="form-control border-0 bg-light py-2.5" placeholder="例如：主日學C班" style="border-radius: 10px;">
      </div>
    </div>
    <div class="text-end mt-4">
      <button class="btn btn-light px-4 me-2 border-0" onclick="closeGroupAddModal()" style="border-radius: 20px;">取消</button>
      <button id="saveNewGroupBtn" class="btn btn-primary px-4 fw-bold border-0" onclick="saveNewGroup()" style="border-radius: 20px; background-color: var(--color-teal);">確認新增</button>
    </div>
  </div>
</div>

<!-- 新增會友 Modal -->
<div id="attendanceAddModal" class="custom-overlay">
  <div class="custom-modal-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0 text-dark">新增會友資料</h5>
      <button type="button" class="btn-close" onclick="closeAttendanceAddModal()"></button>
    </div>
    <hr style="opacity: 0.1;">
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label fw-bold small text-secondary">姓名</label>
        <input type="text" id="editName_Att" class="form-control border-0 bg-light py-2.5" placeholder="請輸入姓名" style="border-radius: 10px;">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-bold small text-secondary">性別</label>
        <select id="editGender_Att" class="form-select border-0 bg-light py-2.5" style="border-radius: 10px;">
          <option value="男">男 👦</option>
          <option value="女">女 👧</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label fw-bold small text-secondary">備註</label>

        <div class="form-check form-switch mt-2">
          <input class="form-check-input" type="checkbox" id="editIsExcluded_Att">

        </div>
      </div>
    </div>
    <div class="text-end mt-4">
      <button class="btn btn-light px-4 me-2 border-0" onclick="closeAttendanceAddModal()" style="border-radius: 20px;">取消</button>
      <button id="saveNewMemberBtn_Att" class="btn btn-primary px-4 fw-bold border-0" onclick="saveNewMemberFromAttendance()" style="border-radius: 20px; background-color: var(--color-teal);">確認儲存</button>
    </div>
  </div>
</div>

<!-- 📷 QR Scanner Modal -->
<div id="qrScannerModal" class="custom-overlay" style="display: none; align-items: center; justify-content: center;">
  <div class="custom-modal-content" style="max-width: 480px; width: 92%; padding: 20px; border-radius: var(--radius-lg); background: #ffffff;">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="fw-bold mb-0 text-dark d-flex align-items-center gap-2" style="font-size: 1.15rem;">
        <span>📷</span> QR Code 掃描報到
      </h5>
      <div class="d-flex align-items-center gap-1">
        <button id="scannerSwitchCamBtn" class="btn btn-sm btn-light border-0 px-2.5 py-1" onclick="switchScannerCamera()" title="切換鏡頭" style="border-radius: 12px; display: none; font-size: 0.9rem;">
          🔄 切換鏡頭
        </button>
        <button id="scannerSoundBtn" class="btn btn-sm btn-light border-0 px-2 py-1" onclick="toggleScannerSound()" title="提示音開關" style="border-radius: 12px; font-size: 0.9rem;">
          🔔
        </button>
        <button type="button" class="btn-close ms-1" onclick="closeScannerModal()"></button>
      </div>
    </div>
    <div id="scannerStatusTip" class="alert py-2 px-3 mb-2 small fw-bold text-center border-0" style="background: #f1f5f9; color: #475569; border-radius: 12px; transition: all 0.3s ease;">
      請將會友 QR Code 對準鏡頭
    </div>
    <div style="position: relative; width: 100%; border-radius: 16px; overflow: hidden; background: #0f172a; min-height: 260px;">
      <div id="modal-qr-reader" style="width: 100%;"></div>
      <div id="scannerFlash" style="position: absolute; inset: 0; background: rgba(34, 197, 94, 0.45); display: none; z-index: 10; pointer-events: none;"></div>
    </div>
    <div class="text-center mt-3">
      <button class="btn btn-light px-4 py-2 border-0 fw-bold text-secondary" onclick="closeScannerModal()" style="border-radius: 20px;">關閉相機</button>
    </div>
  </div>
</div>
