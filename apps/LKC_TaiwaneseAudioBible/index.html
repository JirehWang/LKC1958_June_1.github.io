<!DOCTYPE html>
<html lang="zh-TW" data-theme="parchment" data-fontsize="large">
<head>
    <script type="module" src="../../firebase/observability-browser.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#faf7f0">
    <title>台語有聲聖經 - 林口教會</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔊</text></svg>">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Style Sheet with Cache Buster -->
    <link rel="stylesheet" href="style.css?v=2.4.0">
    <!-- Central FHL Bible Parser Service -->
    <script src="../LKC_ppt_generator/bible-service.js?v=2.4.0"></script>
</head>
<body>
    <div class="app-container">
        <!-- Top App Bar -->
        <header class="app-header">
            <div class="header-main-row">
                <div class="logo-area">
                    <span class="logo-icon" aria-hidden="true">🔊</span>
                    <div>
                        <h1>台語有聲聖經</h1>
                        <p class="church-sub">林口長老教會</p>
                    </div>
                </div>

                <div class="header-actions">
                    <!-- Open Scripture Picker Modal Button (Huge & Prominent) -->
                    <button type="button" id="btn-open-picker" class="btn-action-primary" title="選擇書卷與章數">
                        <span class="btn-icon">📖</span>
                        <span>選書卷章節</span>
                    </button>

                    <!-- Open Settings Modal Button -->
                    <button type="button" id="btn-open-settings" class="btn-action-outline" title="調整字體大小、主題與譯本設定">
                        <span class="btn-icon">⚙️</span>
                        <span>設定</span>
                    </button>

                    <a href="../../index.html" class="btn-back" title="返回首頁">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        <span>首頁</span>
                    </a>
                </div>
            </div>
        </header>

        <!-- Main Screen: Focused on Audio Player + Big Scripture Reading Board -->
        <main class="app-main-layout">
            <!-- Senior Audio Player Card -->
            <section class="senior-player-card" id="senior-player-card">
                <!-- Top Status Row -->
                <div class="player-header-row">
                    <div class="player-title-box">
                        <span class="sound-wave-icon">🎵</span>
                        <h2 id="current-chapter-title" class="player-chapter-title">【詩篇 第 23 章】</h2>
                        <span id="audio-source-name" class="audio-ver-badge">巴克禮台語有聲聖經</span>
                    </div>
                    <button type="button" id="btn-player-change-book" class="btn-pill-change" title="更換其他書卷章節">
                        <span>📖 更換經文</span>
                    </button>
                </div>

                <!-- Big Audio Controls Row -->
                <div class="player-main-controls">
                    <!-- Prev Chapter Button -->
                    <button type="button" id="btn-prev-chap" class="btn-nav-senior" title="上一章">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polygon points="19 20 9 12 19 4 19 20"></polygon>
                            <line x1="5" y1="19" x2="5" y2="5"></line>
                        </svg>
                        <span class="btn-text">上一章</span>
                    </button>

                    <!-- Giant Circular Play / Pause Button -->
                    <button type="button" id="btn-play-pause" class="btn-giant-play" title="播放 / 暫停" aria-label="播放或暫停">
                        <span class="play-icon" id="play-pause-icon">▶</span>
                        <span class="play-label" id="play-pause-label">播放</span>
                    </button>

                    <!-- Next Chapter Button -->
                    <button type="button" id="btn-next-chap" class="btn-nav-senior" title="下一章">
                        <span class="btn-text">下一章</span>
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polygon points="5 4 15 12 5 20 5 4"></polygon>
                            <line x1="19" y1="5" x2="19" y2="19"></line>
                        </svg>
                    </button>
                </div>

                <!-- Progress Bar & Time Display -->
                <div class="player-progress-row">
                    <span id="time-current" class="time-text">00:00</span>
                    <div class="slider-wrap">
                        <input type="range" id="audio-seek-bar" class="senior-range" min="0" max="100" value="0" step="0.1" aria-label="音訊進度">
                    </div>
                    <span id="time-total" class="time-text">00:00</span>
                </div>

                <!-- Hidden HTML5 Audio Element -->
                <audio id="bible-audio" preload="auto"></audio>
            </section>

            <!-- Multi-chapter Playlist Card (if multiple chapters queried) -->
            <section class="playlist-card" id="playlist-card" style="display: none;">
                <h3 class="playlist-title">播放章節清單</h3>
                <div class="playlist-container" id="playlist-container"></div>
            </section>

            <!-- Full-width Scripture Reading Board (Maximized Screen Area for Seniors) -->
            <section class="scripture-container-card">
                <div class="scripture-header">
                    <div class="scripture-header-left">
                        <h2 id="scripture-title-display">台語聖經經文</h2>
                        <span id="scripture-info-display" class="scripture-badge">詩篇 第 23 章</span>
                        <span class="scripture-hint-pill" title="點擊下方任一節經文，音訊會自動跳轉至該節開始朗讀">💡 點擊經節可跳轉播放</span>
                    </div>
                    <div class="scripture-header-nav">
                        <button type="button" id="btn-header-prev" class="btn-icon-nav" title="上一章">◀ 上一章</button>
                        <button type="button" id="btn-header-next" class="btn-icon-nav" title="下一章">下一章 ▶</button>
                    </div>
                </div>
                
                <!-- Scripture Text Content Body -->
                <div class="scripture-content-body" id="scripture-body">
                    <div class="placeholder-msg">
                        <span class="placeholder-icon">📖</span>
                        <p>正在載入聖經經文...</p>
                    </div>
                </div>

                <!-- Scripture Bottom Large Navigation Footer -->
                <div class="scripture-footer-nav" id="scripture-footer-nav">
                    <button type="button" id="btn-footer-prev" class="btn-footer-nav-lg">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                        <span>上一章：<strong id="footer-prev-label">--</strong></span>
                    </button>
                    <div class="footer-center-info">
                        <span id="footer-current-label">第 -- 章</span>
                    </div>
                    <button type="button" id="btn-footer-next" class="btn-footer-nav-lg">
                        <span>下一章：<strong id="footer-next-label">--</strong></span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M9 18l6-6-6-6"/>
                        </svg>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <!-- ==================== MODAL 1: 選擇聖經卷章彈出視窗 ==================== -->
    <div id="modal-scripture-picker" class="modal-overlay" style="display: none;">
        <div class="modal-card modal-picker-card">
            <div class="modal-header">
                <div class="modal-title-area">
                    <span class="modal-icon">📖</span>
                    <h3>選擇聖經書卷與章數</h3>
                </div>
                <button type="button" id="btn-close-picker" class="btn-modal-close" title="關閉視窗">✕</button>
            </div>

            <div class="modal-body">
                <!-- Visual Testament Tabs -->
                <div class="testament-tabs-large">
                    <button type="button" class="tab-btn-lg active" data-testament="ot">
                        <span class="tab-icon">📜</span>
                        <span>舊約聖經 (39卷)</span>
                    </button>
                    <button type="button" class="tab-btn-lg" data-testament="nt">
                        <span class="tab-icon">✝️</span>
                        <span>新約聖經 (27卷)</span>
                    </button>
                </div>

                <!-- Book Badges Grid -->
                <div class="catalog-books-grid" id="catalog-books-container"></div>

                <!-- Chapter Box -->
                <div class="catalog-chapters-box" id="catalog-chapters-section">
                    <div class="chapters-box-header">
                        <div class="chapters-header-left">
                            <span class="icon-point">👉</span>
                            <span class="curr-book-title" id="catalog-selected-book-name">【詩篇】</span>
                            <span class="chap-guide-text">請點選章數：</span>
                        </div>
                    </div>
                    <div class="catalog-chapters-grid" id="catalog-chapters-grid"></div>
                </div>

                <!-- Manual Range Query (Drawer) -->
                <div class="manual-query-drawer">
                    <div class="manual-query-toggle" id="manual-query-toggle">
                        <span>🔍 手動輸入指定經文範圍 (例如: 弗 5:1-4 或 詩篇 23)</span>
                        <span class="toggle-icon">＋</span>
                    </div>
                    <div class="manual-query-body" id="manual-query-body" style="display: none;">
                        <div class="query-input-wrap">
                            <input type="text" id="query-input" placeholder="例如: 詩篇 23 或 弗 5:1-4" class="form-input-lg" value="詩篇 23">
                            <button type="button" id="btn-query" class="btn-primary-lg">查詢</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== MODAL 2: 偏好設定彈出視窗 ==================== -->
    <div id="modal-settings" class="modal-overlay" style="display: none;">
        <div class="modal-card modal-settings-card">
            <div class="modal-header">
                <div class="modal-title-area">
                    <span class="modal-icon">⚙️</span>
                    <h3>閱讀與播放設定</h3>
                </div>
                <button type="button" id="btn-close-settings" class="btn-modal-close" title="關閉視窗">✕</button>
            </div>

            <div class="modal-body settings-modal-body">
                <!-- Setting Item: 字體大小 -->
                <div class="setting-row">
                    <label class="setting-label">🔤 經文字體大小</label>
                    <div class="btn-group-pill setting-pill-group">
                        <button type="button" class="btn-tool-pill" data-size="standard">標準</button>
                        <button type="button" class="btn-tool-pill active" data-size="large">大字 (推薦)</button>
                        <button type="button" class="btn-tool-pill" data-size="xlarge">特大</button>
                        <button type="button" class="btn-tool-pill" data-size="huge">超大尊榮</button>
                    </div>
                </div>

                <!-- Setting Item: 主題切換 -->
                <div class="setting-row">
                    <label class="setting-label">🎨 閱讀主題色彩</label>
                    <div class="btn-group-pill setting-pill-group">
                        <button type="button" class="btn-theme-pill active" data-theme="parchment">☀️ 護眼米紙 (推薦)</button>
                        <button type="button" class="btn-theme-pill" data-theme="light">⚪ 簡約白</button>
                        <button type="button" class="btn-theme-pill" data-theme="dark">🌙 夜間模式</button>
                    </div>
                </div>

                <!-- Setting Item: 語速選擇 -->
                <div class="setting-row">
                    <label class="setting-label">⏱️ 語音播放語速</label>
                    <div class="btn-group-speed">
                        <button type="button" class="btn-speed-pill" data-speed="0.8">🐢 慢速 0.8x</button>
                        <button type="button" class="btn-speed-pill active" data-speed="1.0">🚶 正常 1.0x</button>
                        <button type="button" class="btn-speed-pill" data-speed="1.2">🐇 稍快 1.2x</button>
                    </div>
                </div>

                <!-- Setting Item: 聖經譯本 -->
                <div class="setting-row select-row">
                    <label for="bible-ver-select" class="setting-label">📜 聖經文字譯本</label>
                    <select id="bible-ver-select" class="form-select-lg">
                        <option value="tghg" selected>台語：巴克禮台漢本 (tghg)</option>
                        <option value="bklhl">台語：巴克禮漢羅本 (bklhl)</option>
                        <option value="bklcl">台語：巴克禮全羅本 (bklcl)</option>
                        <option value="ttvhl2021">台語：現代台語2021漢字版 (ttvhl2021)</option>
                        <option value="ttvcl2021">台語：現代台語2021全羅版 (ttvcl2021)</option>
                        <option value="unv">華語：和合本神版 (unv)</option>
                        <option value="unv_god">華語：和合本上帝版 (unv_god)</option>
                    </select>
                </div>

                <!-- Setting Item: 語音譯本 -->
                <div class="setting-row select-row">
                    <label for="audio-ver-select" class="setting-label">🔊 語音朗讀版本</label>
                    <select id="audio-ver-select" class="form-select-lg">
                        <option value="1" selected>巴克禮台語有聲聖經</option>
                        <option value="5">台語新約 (長老教會授權版)</option>
                        <option value="0">華語：和合本有聲聖經</option>
                    </select>
                </div>

                <!-- Setting Item: 自動下一章 -->
                <div class="setting-row">
                    <label class="senior-checkbox-label">
                        <input type="checkbox" id="auto-next" checked>
                        <span>播放結束後自動播放下一章</span>
                    </label>
                </div>

                <div class="modal-footer-btn-wrap">
                    <button type="button" id="btn-save-settings" class="btn-primary-lg btn-block">✓ 完成設定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-message" class="toast"></div>

    <!-- Application Script with Cache Buster -->
    <script src="script.js?v=2.4.0"></script>
</body>
</html>
