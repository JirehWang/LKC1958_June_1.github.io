<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事項類型管理 - 教會行事曆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    
    :root {
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --font-family: 'Outfit', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
    }
    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-dark);
      letter-spacing: -0.01em;
    }
    .type-card {
      border-left: 6px solid #6366f1;
      border-radius: 12px !important;
      border-top: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02) !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      background: var(--card-bg);
    }
    .type-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -4px rgba(0, 0, 0, 0.04) !important;
    }
    .type-child {
      margin-left: 2.5rem;
      position: relative;
    }
    .type-child::before {
      content: '';
      position: absolute;
      left: -1.25rem;
      top: -12px;
      bottom: 24px;
      width: 2px;
      border-left: 2px dashed #cbd5e1;
    }
    .pill {
      font-size: .72rem;
      padding: .35em .75em;
      border-radius: 999px;
      font-weight: 600;
    }
    .sync-pill {
      background: #e0e7ff;
      color: #4338ca;
    }
    .lock-pill {
      background: #fdf2f8;
      color: #be185d;
    }
    .hidden-pill {
      background: #f1f5f9;
      color: #475569;
    }
    .field-row {
      padding: .75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: #fff;
      margin-bottom: .5rem;
      transition: all 0.15s ease;
    }
    .field-row:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .field-row .field-type-badge {
      font-size: .7rem;
      padding: .2em .6em;
      border-radius: 6px;
      background: #e0e7ff;
      color: #4338ca;
      font-weight: 600;
    }
    .empty-hint {
      padding: 4rem;
      text-align: center;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Global Buttons facelifts */
    .btn {
      border-radius: 8px !important;
      font-weight: 500 !important;
      padding: 0.45rem 0.9rem !important;
      font-size: 0.85rem !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 0.25rem !important;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important;
    }
    .btn:hover {
      transform: translateY(-1px) !important;
    }
    .btn-primary {
      background-color: var(--primary-color) !important;
      border-color: var(--primary-color) !important;
      color: #fff !important;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover) !important;
      border-color: var(--primary-hover) !important;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2) !important;
    }
    .btn-outline-primary {
      border-color: var(--primary-color) !important;
      color: var(--primary-color) !important;
      background-color: transparent !important;
    }
    .btn-outline-primary:hover {
      background-color: var(--primary-color) !important;
      color: #fff !important;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2) !important;
    }
    .btn-outline-secondary {
      border-color: var(--border-color) !important;
      color: var(--text-dark) !important;
      background-color: #fff !important;
    }
    .btn-outline-secondary:hover {
      background-color: #f1f5f9 !important;
      border-color: #cbd5e1 !important;
    }
    .btn-outline-success {
      border-color: #10b981 !important;
      color: #10b981 !important;
      background-color: transparent !important;
    }
    .btn-outline-success:hover {
      background-color: #10b981 !important;
      color: #fff !important;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2) !important;
    }
    .btn-outline-danger {
      border-color: #ef4444 !important;
      color: #ef4444 !important;
      background-color: transparent !important;
    }
    .btn-outline-danger:hover {
      background-color: #ef4444 !important;
      color: #fff !important;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2) !important;
    }
    .btn-warning {
      background-color: #f59e0b !important;
      border-color: #f59e0b !important;
      color: #fff !important;
    }
    .btn-warning:hover {
      background-color: #d97706 !important;
      border-color: #d97706 !important;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2) !important;
    }

    /* Form Controls styling */
    .form-control, .form-select {
      border-radius: 8px !important;
      border: 1px solid #cbd5e1;
      padding: 0.55rem 0.75rem;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      color: var(--text-dark);
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--primary-color) !important;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12) !important;
      outline: none;
    }

    /* Modals styling */
    .modal-content {
      border-radius: 16px !important;
      border: none !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
    }
    .modal-header {
      border-bottom: 1px solid var(--border-color) !important;
      padding: 1.25rem 1.5rem !important;
      background-color: #f8fafc !important;
    }
    .modal-body {
      padding: 1.5rem !important;
    }
    .modal-footer {
      border-top: 1px solid var(--border-color) !important;
      padding: 1rem 1.5rem !important;
    }
    .modal-title {
      color: var(--text-dark);
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1">⚙️ 事項類型管理</h2>
      <div class="text-muted small">定義「講道資訊 / 主日學 / 會議 ...」這類事項類型與每種類型的欄位</div>
    </div>
    <div class="d-flex gap-2">
      <a href="index.html" class="btn btn-outline-secondary">← 返回行事曆主頁</a>
      <button class="btn btn-warning" onclick="runMigration()" title="把舊的『聚會 / 講道 / 事工』sheet 轉成新結構">🔄 遷移舊資料</button>
      <button class="btn btn-primary" onclick="openAddTypeModal('')">＋ 新增頂層類型</button>
    </div>
  </div>

  <div id="typesContainer">
    <div class="empty-hint">
      <div class="spinner-border text-primary mb-2"></div>
      <div>載入中...</div>
    </div>
  </div>
</div>

<!-- 類型編輯 Modal -->
<div class="modal fade" id="typeModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-light">
        <h5 class="modal-title fw-bold" id="typeModalTitle">新增類型</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="typeForm_typeId">
        <input type="hidden" id="typeForm_parentTypeId">

        <div class="mb-3">
          <label class="form-label fw-bold">名稱 *</label>
          <input type="text" id="typeForm_name" class="form-control" placeholder="例：主日學 / 會議">
        </div>
        <div class="row g-2 mb-3">
          <div class="col-3">
            <label class="form-label fw-bold">圖示</label>
            <input type="text" id="typeForm_icon" class="form-control text-center" placeholder="📖">
          </div>
          <div class="col-5">
            <label class="form-label fw-bold">主題色</label>
            <input type="color" id="typeForm_color" class="form-control form-control-color w-100" value="#667eea">
          </div>
          <div class="col-4">
            <label class="form-label fw-bold">排序</label>
            <input type="number" id="typeForm_sortOrder" class="form-control" min="0">
          </div>
        </div>

        <div id="typeForm_parentOnlySection">
          <hr>
          <div class="fw-bold mb-2">📡 同步到下游系統</div>
          <div class="form-check mb-1">
            <input class="form-check-input" type="checkbox" id="typeForm_syncToAttendance">
            <label class="form-check-label" for="typeForm_syncToAttendance">主日點名（場次選單）</label>
          </div>
          <div class="form-check mb-1">
            <input class="form-check-input" type="checkbox" id="typeForm_syncToMinistry">
            <label class="form-check-label" for="typeForm_syncToMinistry">事工管理（聚會表）</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="typeForm_syncToWorship">
            <label class="form-check-label" for="typeForm_syncToWorship">敬拜團（公佈欄）</label>
          </div>

          <hr>
          <div class="mb-3">
            <label class="form-label fw-bold">🔒 查看密碼（選填，僅頂層類型可設）</label>
            <input type="text" id="typeForm_password" class="form-control" placeholder="留空 = 公開；設了密碼 → 看公開頁要輸入">
            <div class="form-text">子類型自動繼承父類型密碼</div>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="typeForm_hidden">
            <label class="form-check-label" for="typeForm_hidden">隱藏此類型（公開頁完全不顯示，但 admin 仍可見）</label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" onclick="saveType()">💾 儲存</button>
      </div>
    </div>
  </div>
</div>

<!-- 欄位管理 Modal -->
<div class="modal fade" id="fieldsModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-light">
        <h5 class="modal-title fw-bold"><span id="fieldsModalTypeName"></span> - 欄位管理</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-info py-2 small mb-3 d-flex justify-content-between align-items-center">
          <span>💡 欄位定義在<b>頂層類型</b>上，子類型自動繼承。</span>
          <button class="btn btn-sm btn-outline-success" onclick="exportFieldsTemplate()" title="下載 Excel 模板，填好後從月曆頁上傳">
            📥 匯出 Excel 模板
          </button>
        </div>
        <div id="fieldsList"></div>
        <button class="btn btn-outline-primary w-100 mt-3" onclick="openAddFieldRow()">＋ 新增欄位</button>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">關閉</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>window._GAS_KEY = 'LKC_MasterSchedule'; window._FORCE_PRODUCTION_GAS = true;</script>
<script src="../../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../supabase/supabase-config.js"></script>
<script src="calendar-supabase.js?v=20260910"></script>
<script src="types.js?v=20260910"></script>
</body>
</html>
