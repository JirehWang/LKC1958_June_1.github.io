<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#059669">
  <link rel="icon" href="data:,">
  <title>林口教會幹事 ERP</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      color: #2d3748;
      background: #f8fafc;
    }
    body { min-height: 100vh; display: flex; flex-direction: column; margin: 0; background: #f8fafc; }
    header {
      padding: 40px 20px 30px;
      color: white;
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      text-align: center;
      box-shadow: 0 4px 20px rgba(5, 150, 105, .15);
    }
    header h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; letter-spacing: 2px; }
    header p { margin: 0; font-size: 14px; letter-spacing: 1px; opacity: .82; }
    .container {
      flex: 1;
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 0 auto;
      padding: 36px 24px;
    }
    .card {
      display: flex;
      min-height: 190px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px 22px;
      border-top: 4px solid #059669;
      border-radius: 16px;
      color: #2d3748;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .07);
      text-decoration: none;
      transition: transform .22s ease, box-shadow .22s ease;
    }
    .card:hover { transform: translateY(-6px); box-shadow: 0 12px 28px rgba(0, 0, 0, .13); }
    .card:focus-visible { outline: 3px solid rgba(5, 150, 105, .4); outline-offset: 4px; }
    .icon-wrap {
      display: flex;
      width: 64px;
      height: 64px;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      border-radius: 50%;
      background: rgba(5, 150, 105, .1);
      font-size: 28px;
    }
    .title { color: #2d3748; font-size: 15px; font-weight: 600; line-height: 1.5; text-align: center; }
    footer { padding: 18px; border-top: 1px solid #e2e8f0; color: #a0aec0; background: white; font-size: 12px; text-align: center; }
    @media (max-width: 560px) {
      header { padding: 32px 18px 24px; }
      header h1 { font-size: 23px; letter-spacing: 1px; }
      header p { font-size: 12px; }
      .container { grid-template-columns: 1fr; gap: 14px; padding: 22px 18px; }
      .card { min-height: 154px; padding: 22px 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1>林口教會幹事 ERP</h1>
    <p>Church Secretary ERP Portal</p>
  </header>
  <main class="container" aria-label="教會幹事 ERP 入口">
    <a class="card" href="dashboard.html" target="_blank" rel="noopener">
      <div class="icon-wrap" aria-hidden="true">◈</div>
      <div class="title">教會幹事 Dashboard</div>
    </a>
    <a class="card" href="../LKC_MinistrySchedule/" target="_blank" rel="noopener">
      <div class="icon-wrap" aria-hidden="true">📊</div>
      <div class="title">教會事工總表系統</div>
    </a>
    <a class="card" href="../LKC_WorshipPPT/" target="_blank" rel="noopener">
      <div class="icon-wrap" aria-hidden="true">禮</div>
      <div class="title">禮拜PPT產生器</div>
    </a>
    <a class="card" href="../LKC_SundayserviceAttendance/" target="_blank" rel="noopener">
      <div class="icon-wrap" aria-hidden="true">📝</div>
      <div class="title">教會主日出席點名系統</div>
    </a>
    <a class="card" href="../LKC_MasterSchedule/" target="_blank" rel="noopener">
      <div class="icon-wrap" aria-hidden="true">📅</div>
      <div class="title">教會行事曆管理系統</div>
    </a>
    <a class="card" href="../LKC_SundayBulletin/" target="_blank" rel="noopener">
      <div class="icon-wrap" aria-hidden="true">📰</div>
      <div class="title">教會週報管理系統</div>
    </a>
  </main>
  <footer>© 林口教會幹事 ERP</footer>
</body>
</html>
