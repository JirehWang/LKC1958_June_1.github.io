<script type="module" src="../../firebase/observability-browser.js"></script>
<style>
  .stats-container { padding: 10px; background-color: #fff; border-radius: 24px; }
  .progress { background-color: #f1f5f9; border-radius: 10px; box-shadow: inset 0 1px 2px rgba(0,0,0,.05); height: 12px; }
  .mode-switch-btn { width: 50%; font-weight: 800; border-radius: 12px !important; }
  .stat-card { border-radius: 18px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); height: 100%; display: flex; flex-direction: column; justify-content: center; border: 1.5px solid #f1f5f9; background: #ffffff; }
  /* 基礎表單欄位樣式 */
  .form-control, .form-select {
    border-radius: 12px;
    border: 1.5px solid #cbd5e1;
    padding: 8px 12px;
    transition: all 0.2s;
  }
  .form-control:focus, .form-select:focus {
    border-color: #10b981;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    outline: none;
  }

  /* 修正 input-group 內部的元件邊框疊合怪異問題 */
  .input-group .form-control, 
  .input-group .form-select, 
  .input-group .input-group-text, 
  .input-group .btn {
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    margin: 0 !important;
  }
  
  .input-group.border {
    border: 1.5px solid #cbd5e1 !important;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  
  .input-group.border:focus-within {
    border-color: #10b981 !important;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15) !important;
  }
</style>

<div class="stats-container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-black mb-0 text-dark" style="font-size: 1.35rem;">📊 聚會出席統計</h4>
  </div>
  
  <div class="bg-light p-3 rounded-4 border border-light mb-3">
    <div class="btn-group w-100 mb-3" role="group" style="background: rgba(148, 163, 184, 0.05); padding: 4px; border-radius: 16px;">
      <input type="radio" class="btn-check" name="statMode" id="modeRange" autocomplete="off" checked onclick="toggleStatMode('range')">
      <label class="btn btn-outline-success mode-switch-btn border-0 py-2" for="modeRange">📅 區間統計</label>
      <input type="radio" class="btn-check" name="statMode" id="modeSingle" autocomplete="off" onclick="toggleStatMode('single')">
      <label class="btn btn-outline-success mode-switch-btn border-0 py-2" for="modeSingle">📆 單日檢視</label>
    </div>

    <div class="row g-2 align-items-end" id="rangeInputArea">
      <div class="col-6">
        <label class="small text-muted fw-bold">開始日期</label>
        <input type="date" id="statsStart" class="form-control form-control-sm">
      </div>
      <div class="col-6">
        <label class="small text-muted fw-bold">結束日期</label>
        <input type="date" id="statsEnd" class="form-control form-control-sm">
      </div>
      <div class="col-12 mt-2">
         <label class="small text-muted fw-bold">出席率門檻 (%)</label>
         <input type="number" id="threshold" class="form-control form-control-sm" value="100" min="0" max="100" placeholder="顯示低於此%的人">
      </div>
    </div>

    <div class="row g-2 align-items-end" id="singleInputArea" style="display: none;">
      <div class="col-12">
        <label class="small text-muted fw-bold">選擇日期</label>
        <input type="date" id="statsSingleDate" class="form-control form-control-sm">
      </div>
    </div>

    <div class="row g-2 mt-2">
      <div class="col-12">
        <label class="small text-muted fw-bold mb-1">名單過濾基準</label>
        <select id="baseSheetSource" class="form-select form-select-sm shadow-sm fw-bold">
          <option value="會友名單">👥 依據全體會友</option>
          <option value="會員名單">🌟 依據正式會員</option>
        </select>
      </div>
    </div>

    <div class="row g-2 mt-2 bg-white p-2 rounded border shadow-sm align-items-end">
      <div class="col-5">
        <label class="small text-muted fw-bold mb-1">📂 點名類別</label>
        <select id="statsCategorySelect" class="form-select form-select-sm fw-bold border-secondary" onchange="updateStatsGroupSelect()">
          <option value="" disabled selected>載入中...</option>
        </select>
      </div>
      <div class="col-7">
        <label class="small text-muted fw-bold mb-1">📌 選擇群組</label>
        <select id="statsGroupSelect" class="form-select form-select-sm fw-bold border-primary text-primary shadow-sm" onchange="fetchStatsData()">
          <option value="" disabled selected>載入中...</option>
        </select>
      </div>
    </div>

    <div class="row g-2 mt-3">
      <div class="col-6">
        <button class="btn btn-success btn-sm w-100 fw-bold shadow-sm py-2" onclick="fetchStatsData()">🔍 開始查詢</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-success btn-sm w-100 fw-bold shadow-sm py-2 bg-white" onclick="exportToCSV()">📥 匯出 Excel</button>
      </div>
    </div>

    <div class="row g-2 mt-2" id="trendAnalysisRow" style="display:none;">
      <div class="col-12">
        <button class="btn btn-warning btn-sm w-100 fw-bold shadow-sm py-2" onclick="openTrendModal()">📈📉 出席頻率變化分析</button>
      </div>
    </div>
    
    <div class="row g-2 mt-2">
      <div class="col-12">
        <div class="input-group shadow-sm border overflow-hidden bg-white">
          <span class="input-group-text bg-white border-0 text-muted ps-3">🔍</span>
          <input type="text" id="statsNameSearch" class="form-control border-0 px-2"
                 placeholder="輸入姓名即時過濾（注音/拼音可直接輸入）..."
                 autocomplete="off"
                 oninput="filterStatsTable()"
                 oncompositionend="filterStatsTable()"
                 style="box-shadow: none !important; font-size: 0.85rem; padding: 6px 12px !important;">
          <button type="button" class="btn bg-white border-0 text-muted" id="statsNameClearBtn"
                  style="display:none;"
                  onclick="document.getElementById('statsNameSearch').value=''; filterStatsTable();">✕</button>
        </div>
      </div>
    </div>
  </div>

  <div class="row mb-3 text-center g-2">
    <div class="col-4">
      <div class="stat-card bg-white">
        <div class="small text-muted fw-bold mb-1" id="lblMainStat">總場次</div>
        <div class="h4 mb-0 fw-bold text-primary" id="valMainStat">0</div>
      </div>
    </div>
    <div class="col-4">
      <div class="stat-card" style="background-color: #f1f8f5; border-color: #badbcc;">
        <div class="small text-muted fw-bold mb-1 text-success">📋 名單出席</div>
        <div class="h5 mb-1 fw-bold text-dark" id="valMemberStat">0</div>
        <div class="d-flex justify-content-center gap-2" style="font-size: 0.75rem;">
          <span class="text-primary fw-bold">👦 <span id="valMemberMale">0</span></span>
          <span class="text-danger fw-bold">👧 <span id="valMemberFemale">0</span></span>
        </div>
      </div>
    </div>
    <div class="col-4">
      <div class="stat-card" style="background-color: #fffdf2; border-color: #ffecb5;">
        <div class="small text-muted fw-bold mb-1" style="color: #997404;">👶 新朋友</div>
        <div class="h5 mb-1 fw-bold text-dark" id="valNewFriendStat">0</div>
        <div class="d-flex justify-content-center gap-2" style="font-size: 0.75rem;">
          <span class="text-primary fw-bold">👦 <span id="valNfMale">0</span></span>
          <span class="text-danger fw-bold">👧 <span id="valNfFemale">0</span></span>
        </div>
      </div>
    </div>
  </div>

  <div class="table-responsive border rounded" style="min-height: 500px; background: white;">
    <table class="table table-sm table-hover align-middle mb-0">
      <thead class="table-light sticky-top" style="z-index: 10; top: 0;"> 
        <tr class="small text-muted" id="tableHeaderRow">
          <th class="ps-3">姓名</th>
          <th class="text-center">性別</th>
          <th class="text-center">次數</th>
          <th style="width: 35%;">出席率</th>
        </tr>
      </thead>
      <tbody id="statsTableBody" class="small">
        <tr><td colspan="4" class="text-center p-5 text-muted">正在載入選單...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 頻率變化分析 Modal -->
<div id="trendModal" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:12px; width:92%; max-width:540px; max-height:88vh; overflow-y:auto; padding:20px; position:relative;">
    <button onclick="closeTrendModal()" style="position:absolute;top:12px;right:14px;border:none;background:none;font-size:18px;cursor:pointer;">✕</button>
    <h5 class="fw-bold mb-1">📈📉 出席頻率變化分析</h5>
    <div class="text-muted small mb-3" id="trendSubtitle"></div>

    <div class="d-flex align-items-center gap-2 mb-3" style="font-size: 0.85rem;">
      <label class="small fw-bold text-muted mb-0">分析近期週數</label>
      <div class="input-group input-group-sm" style="width:85px;">
        <input type="number" id="trendRecentWeeks" class="form-control border-secondary" value="8" min="3">
        <span class="input-group-text bg-white border-secondary">週</span>
      </div>
      <button class="btn btn-sm btn-primary fw-bold" onclick="runTrendAnalysis()">重新分析</button>
    </div>

    <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
      <label class="small fw-bold text-muted mb-0">衰退幅度門檻</label>
      <div class="input-group input-group-sm" style="width:90px;">
        <input type="number" id="trendDropThreshold" class="form-control" value="20" min="1" max="100">
        <span class="input-group-text">%</span>
      </div>
      <button class="btn btn-sm btn-outline-secondary fw-bold" onclick="applyTrendFilter()">重新篩選</button>
      <button class="btn btn-sm btn-outline-success fw-bold ms-auto" onclick="exportTrendCSV()">📥 匯出 Excel</button>
    </div>

    <div id="trendLoading" style="display:none;" class="text-center py-4">
      <div class="spinner-border text-warning"></div>
      <div class="small text-muted mt-2">演算法分析中...</div>
    </div>
    <div id="trendResult"></div>
  </div>
</div>

<script src="STATS.js"></script>
