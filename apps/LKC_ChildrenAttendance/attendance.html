<script type="module" src="../../firebase/observability-browser.js"></script>
<style>
  /* 通用適應性排版與活潑風格 */
  .attendance-scroll-area {
    height: calc(100vh - 290px);
    background: #ffffff;
    padding: 15px;
    overflow-y: auto;
    border-radius: 24px;
    border: 1px solid rgba(226, 232, 240, 0.8);
    box-sizing: border-box;
    box-shadow: inset 0 2px 8px rgba(148, 163, 184, 0.05);
  }
  
  #attendanceListBody {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(22%, 85px), 1fr));
    gap: 10px;
  }

  .att-item {
    background: #f8fafc;
    border: 1px solid #f1f5f9;
    border-radius: 16px;
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    height: 80px;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02), 0 2px 4px -1px rgba(0,0,0,0.01);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .att-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 16px -2px rgba(148, 163, 184, 0.12);
    background: #ffffff;
    border-color: #cbd5e1;
  }

  .att-item:active { transform: scale(0.95); }

  .att-name {
    font-size: clamp(0.85rem, 2.5vw, 1.05rem);
    font-weight: 800;
    text-align: center;
    line-height: 1.2;
    color: #1e293b;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-top: 4px;
  }

  .att-info {
    font-size: clamp(0.65rem, 1.5vw, 0.8rem);
    margin-top: 2px;
    font-weight: 700;
  }

  .att-item input[type="checkbox"] {
    width: 16px;
    height: 16px;
    margin-bottom: 2px;
    pointer-events: none;
    accent-color: #3b82f6;
  }

  /* 勾選但尚未送出：溫暖明亮的藍色漸層 */
  .att-item.selected {
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%) !important;
    color: white !important;
    border-color: transparent !important;
    box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3) !important;
  }
  .att-item.selected .att-name { color: white !important; }
  .att-item.selected .att-info, .att-item.selected .gender-text { color: rgba(255, 255, 255, 0.9) !important; }
  
  /* 已送出：充滿活力的綠色漸層 */
  .att-item.submitted {
    background: linear-gradient(135deg, #10b981 0%, #047857 100%) !important;
    border-color: transparent !important;
    box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3) !important;
    cursor: pointer;
  }
  .att-item.submitted .att-name { color: white !important; }
  .att-item.submitted .att-info, .att-item.submitted .gender-text { color: rgba(255, 255, 255, 0.9) !important; }
  .att-item.submitted::after {
    content: "✓";
    position: absolute;
    top: 4px;
    right: 8px;
    color: white;
    font-weight: 900;
    font-size: 14px;
  }
  
  /* 鎖定中 */
  .att-item.locked {
    background: #f1f5f9 !important;
    border-color: #e2e8f0 !important;
    cursor: not-allowed !important;
    opacity: 0.55;
    box-shadow: none !important;
  }
  .att-item.locked::after {
    content: "🔒";
    position: absolute;
    top: 4px;
    right: 8px;
    font-size: 10px;
    opacity: 0.6;
  }
  
  .full-width-msg {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 20px;
    color: #64748b;
    width: 100%;
    font-weight: bold;
  }
  
  .custom-overlay {
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(15, 23, 42, 0.6);
    z-index:9999;
    overflow-y: auto;
    backdrop-filter: blur(4px);
  }
  
  .custom-modal-content {
    background: white;
    margin: 30px auto;
    padding: 30px 25px;
    width: min(92%, 500px);
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15);
    position: relative;
    text-align: left;
    box-sizing: border-box;
    border: 1px solid rgba(255,255,255,0.8);
  }
  
  /* 基礎表單欄位樣式 */
  .form-control, .form-select {
    border-radius: 12px;
    border: 1.5px solid #cbd5e1;
    padding: 10px 14px;
    transition: all 0.2s;
  }
  
  .form-control:focus, .form-select:focus {
    border-color: #10b981;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    outline: none;
  }

  /* 修正 input-group 內部的元件邊框疊合怪異問題 */
  .input-group .form-control, 
  .input-group .form-select, 
  .input-group .input-group-text, 
  .input-group .btn {
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    margin: 0 !important;
  }
  
  .input-group.border {
    border: 1.5px solid #cbd5e1 !important;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  
  .input-group.border:focus-within {
    border-color: #10b981 !important;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15) !important;
  }
  
  .btn-gradient-submit {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: white !important;
    border: none !important;
    font-weight: 900;
    border-radius: 16px !important;
    box-shadow: 0 6px 20px rgba(16, 185, 129, 0.25);
    transition: all 0.2s;
  }
  
  .btn-gradient-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
  }
  
  .btn-gradient-submit:active {
    transform: translateY(0) scale(0.97);
  }
</style>

<div class="mb-3 bg-white p-3 rounded-4 shadow-sm border border-light">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <span class="fw-bold text-dark"><span style="font-size: 1.2rem; margin-right: 4px;">📷</span> QR Code 快速報到</span>
    <div class="d-flex gap-1">
      <button class="btn btn-sm btn-outline-info px-3 fw-bold" onclick="triggerVenueDownload()" title="下載目前選定場次的自動跳轉卡">
        📥 下載場次QR
      </button>
      <button id="scanBtn" class="btn btn-sm btn-primary px-3 fw-bold" onclick="toggleScanner()">開啟相機</button>
    </div>
  </div>
  <div id="reader" style="display: none; width: 100%; border-radius: 12px; overflow: hidden; border: 1.5px solid #dee2e6;"></div>
</div>

<div class="bg-white p-4 shadow-sm border border-light" style="border-radius: 24px;">
  <!-- 鎖定模式 Banner -->
  <div id="lockModeBanner" class="alert alert-warning py-2 px-3 mb-3 fw-bold text-center" style="display: none; border-radius: 12px;">
    🔒 鎖定點名場次：<span id="lockModeText"></span>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0 fw-black text-dark" style="font-size: 1.35rem;">🎤 兒童點名系統</h4>
    <button id="btnGroupAdd" class="btn btn-sm btn-outline-success fw-bold shadow-sm px-3" onclick="openGroupAddModal()">
    ➕ 新增群組
    </button>
  </div>
  
  <div class="d-flex justify-content-between gap-2 mb-3">
    <div id="presentCountBadge" class="badge bg-success text-white p-2 small shadow-sm d-flex align-items-center flex-grow-1 justify-content-center" style="font-size: 0.85rem; font-weight: 700;">
        ✅ 已出席：<span id="presentCount" class="mx-1">0</span> 人
    </div>
    <div id="todayDateDisplay" class="badge bg-white text-primary border p-2 small shadow-sm d-flex align-items-center flex-grow-1 justify-content-center" style="font-size: 0.85rem; font-weight: 700; border-color: #cbd5e1 !important;"></div>
  </div>

  <div id="groupSelectRow" class="row g-3 mb-3 bg-light p-3 rounded-4 border border-light mx-0">
    <div class="col-12 col-sm-6 px-1">
      <label class="small text-muted fw-bold mb-1 ps-1">📂 點名類別</label>
      <select id="categorySelect" class="form-select fw-bold border-secondary text-secondary" onchange="updateGroupSelect()">
        <option value="" disabled selected>載入中...</option>
      </select>
    </div>
    <div class="col-12 col-sm-6 px-1">
      <label class="small text-muted fw-bold mb-1 ps-1">📌 選擇群組</label>
      <select id="groupSelect" class="form-select fw-bold border-primary text-primary shadow-sm" onchange="handleGroupSelect()">
        <option value="" disabled selected>載入中...</option>
      </select>
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-12">
      <div class="input-group shadow-sm border overflow-hidden bg-white">
        <span class="input-group-text bg-white border-0 text-muted ps-3">🔍</span>
        <input type="text" id="attSearchInput" class="form-control border-0 px-2" placeholder="搜尋..." oninput="filterAttList()" style="box-shadow: none !important;">
        <button class="btn btn-success fw-bold px-3 border-0" onclick="openAttendanceAddModal()" style="border-radius: 0 !important;">➕ 新增</button>
      </div>
    </div>
  </div>

  <div class="attendance-scroll-area">
    <div id="attendanceListBody"></div>
  </div>

  <div class="d-flex flex-column flex-sm-row align-items-stretch gap-2 mt-3">
    <div class="d-flex flex-row flex-sm-column gap-2 flex-grow-1 flex-sm-grow-0" style="min-width: 170px;">
      <div class="input-group shadow-sm border rounded-3 overflow-hidden flex-grow-1" style="border-color: #cbd5e1 !important;">
        <span class="input-group-text bg-light text-primary border-0 fw-bold small px-2 text-center" style="width: 80px; border-right: 1.5px solid #cbd5e1 !important; border-radius: 0 !important;">👦 新(男)</span>
        <input type="number" id="newFriendsMale" class="form-control border-0 text-center fw-bold px-1" value="0" min="0" style="box-shadow: none !important;">
      </div>
      <div class="input-group shadow-sm border rounded-3 overflow-hidden flex-grow-1" style="border-color: #cbd5e1 !important;">
        <span class="input-group-text bg-light text-danger border-0 fw-bold small px-2 text-center" style="width: 80px; border-right: 1.5px solid #cbd5e1 !important; border-radius: 0 !important;">👧 新(女)</span>
        <input type="number" id="newFriendsFemale" class="form-control border-0 text-center fw-bold px-1" value="0" min="0" style="box-shadow: none !important;">
      </div>
    </div>
    <button id="submitBtn" class="btn btn-gradient-submit btn-lg shadow fw-bold flex-grow-1 py-2" onclick="submitAttendance()" style="font-size: 1.15rem; min-height: 68px;">
      確認送出
    </button>
  </div>
</div>

<!-- 新增群組 Modal -->
<div id="groupAddModal" class="custom-overlay">
  <div class="custom-modal-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0 text-dark">➕ 新增點名群組</h5>
      <button type="button" class="btn-close" onclick="closeGroupAddModal()"></button>
    </div>
    <hr>
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label fw-bold small text-muted">所屬類別</label>
        <select id="newGroupCategory" class="form-select form-select-lg mb-2"></select>
        <input type="text" id="newGroupCategoryCustom" class="form-control" placeholder="或在此輸入全新類別名稱">
      </div>
      <div class="col-12">
        <label class="form-label fw-bold small text-muted">群組名稱</label>
        <input type="text" id="newGroupName" class="form-control form-control-lg" placeholder="例如：幼兒班">
      </div>
    </div>
    <div class="text-end mt-4">
      <button class="btn btn-light px-4 me-2" onclick="closeGroupAddModal()">取消</button>

    </div>
  </div>
</div>

<!-- 新增會友 Modal -->
<div id="attendanceAddModal" class="custom-overlay">
  <div class="custom-modal-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0 text-dark">新增會友資料</h5>
      <button type="button" class="btn-close" onclick="closeAttendanceAddModal()"></button>
    </div>
    <hr>
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label fw-bold small text-muted">姓名</label>
        <input type="text" id="editName_Att" class="form-control form-control-lg" placeholder="請輸入姓名">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-bold small text-muted">性別</label>
        <select id="editGender_Att" class="form-select form-select-lg">
          <option value="男">男 👦</option>
          <option value="女">女 👧</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label fw-bold small text-muted">備註</label>

        <div class="form-check form-switch mt-2">
          <input class="form-check-input" type="checkbox" id="editIsExcluded_Att">

        </div>

      <button class="btn btn-light px-4 me-2" onclick="closeAttendanceAddModal()">取消</button>
      <button id="saveNewMemberBtn_Att" class="btn btn-primary px-4 fw-bold" onclick="saveNewMemberFromAttendance()">確認儲存</button>
    </div>
  </div>
</div>

<!-- 📷 QR Scanner Modal -->
<div id="qrScannerModal" class="custom-overlay" style="display: none; align-items: center; justify-content: center;">
  <div class="custom-modal-content" style="max-width: 480px; width: 92%; padding: 20px; border-radius: 16px; background: #ffffff;">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="fw-bold mb-0 text-dark d-flex align-items-center gap-2" style="font-size: 1.15rem;">
        <span>📷</span> QR Code 掃描報到
      </h5>
      <div class="d-flex align-items-center gap-1">
        <button id="scannerSwitchCamBtn" class="btn btn-sm btn-light border-0 px-2.5 py-1" onclick="switchScannerCamera()" title="切換鏡頭" style="border-radius: 12px; display: none; font-size: 0.9rem;">
          🔄 切換鏡頭
        </button>
        <button id="scannerSoundBtn" class="btn btn-sm btn-light border-0 px-2 py-1" onclick="toggleScannerSound()" title="提示音開關" style="border-radius: 12px; font-size: 0.9rem;">
          🔔
        </button>
        <button type="button" class="btn-close ms-1" onclick="closeScannerModal()"></button>
      </div>
    </div>
    <div id="scannerStatusTip" class="alert py-2 px-3 mb-2 small fw-bold text-center border-0" style="background: #f1f5f9; color: #475569; border-radius: 12px; transition: all 0.3s ease;">
      請將會友 QR Code 對準鏡頭
    </div>
    <div style="position: relative; width: 100%; border-radius: 16px; overflow: hidden; background: #0f172a; min-height: 260px;">
      <div id="modal-qr-reader" style="width: 100%;"></div>
      <div id="scannerFlash" style="position: absolute; inset: 0; background: rgba(34, 197, 94, 0.45); display: none; z-index: 10; pointer-events: none;"></div>
    </div>
    <div class="text-center mt-3">
      <button class="btn btn-light px-4 py-2 border-0 fw-bold text-secondary" onclick="closeScannerModal()" style="border-radius: 20px;">關閉相機</button>
    </div>
  </div>
</div>
