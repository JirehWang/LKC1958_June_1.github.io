<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <script>
    if (window.location.hostname === '127.0.0.1') {
      window.location.replace(window.location.href.replace('//127.0.0.1:', '//localhost:'));
    }
    window._GAS_KEY = 'LKC_WorshipPPT';
    window._WORSHIP_PPT_LIBRARY_GAS_KEY = 'LKC_WorshipPPT_LIBRARY';
    window.LKC_GAS_REQUEST_TIMEOUT_MS = 65000;
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>禮拜PPT產生器</title>
  <link rel="stylesheet" href="style.css?v=20260917d">
  <link rel="stylesheet" href="format.css?v=20260917d">
  <link rel="stylesheet" href="reference-layout.css?v=20260919a">
  <link rel="stylesheet" href="color-controls.css?v=20260917d">
  <link rel="stylesheet" href="layout-groups.css?v=20260917d">
  <link rel="stylesheet" href="pptx-library.css?v=20260917d">
  <link rel="stylesheet" href="sync-opacity.css?v=20260917d">
  <link rel="stylesheet" href="theme.css?v=20260917d">
  <link rel="stylesheet" href="template-switch.css?v=20260917d">
</head>
<body>
  <div id="operation-overlay" class="operation-overlay" aria-hidden="true"><div class="operation-loader"><div class="operation-loader-icon" aria-hidden="true">📖</div><div class="operation-loader-text">運作中…</div></div></div>
  <header class="topbar">
    <div class="brand" style="white-space:nowrap" aria-label="林口教會 禮拜PPT產生器">林口教會 <span>/ 禮拜PPT產生器</span></div>
    <div class="topbar-actions">
      <label>製作模板 <select id="template-selector" aria-label="選擇禮拜 PPT 模板"><option value="taiwanese">台語</option><option value="joint-taiwanese">聯合－台語</option><option value="joint-mandarin">聯合－華語</option></select></label>
      <label>禮拜日期 <input id="service-date" type="date"></label>
      <label class="color-field">投影片底色 <input id="background-color" type="color" value="#ffffff" aria-label="投影片底色"></label>
      <label class="upload button quiet">上傳背景圖<input id="background-image-upload" type="file" accept="image/png,image/jpeg,image/webp"></label>
      <label class="sync-toolbar-option"><input id="sync-hymn-opacity-global" type="checkbox" checked><span>聖詩頁白底透明度同步</span></label>
      <div class="output-scale-toolbar" aria-label="PPT 輸出比例">
        <label>文字 %<input id="lg-output-text-scale" type="number" min="80" max="120" step="1" value="100"></label>
        <label>圖片 %<input id="lg-output-image-scale" type="number" min="80" max="120" step="1" value="100"></label>
        <button class="button quiet" id="layout-save-output-scale" type="button">儲存比例</button>
      </div>
      <button class="button quiet" id="calendar-load">從行事曆帶入</button>
      <button class="button quiet" id="layout-panel-open">版面參數</button>
      <button class="button quiet layout-lock-button" id="layout-lock-toggle" type="button" aria-pressed="false">版面設定已鎖定</button>
      <button class="button" id="save-draft">儲存草稿</button>
      <button class="button primary" id="export-ppt">匯出 PPTX</button>
    </div>
  </header>
  <main class="workspace">
    <aside class="flow-panel"><div class="flow-heading"><p id="template-name">台語主日禮拜</p><strong>製作流程</strong><small>點頁面瀏覽 · 勾選頁面調整版面</small></div><nav id="flow-list" aria-label="禮拜流程"></nav></aside>
    <section class="editor-panel"><div class="panel-heading"><p id="section-kind"></p><h1 id="section-title"></h1></div><form id="editor-form" novalidate></form><p class="save-state" id="save-state" role="status" aria-live="polite" aria-atomic="true" data-state="idle">尚未儲存</p></section>
    <aside class="preview-panel"><div class="preview-heading"><div><p>整份 PPT 預覽</p><strong id="preview-name"></strong></div><div class="page-nav"><button id="page-prev">上一頁</button><span id="slide-count">1 / 1</span><button id="page-next">下一頁</button></div></div><div class="slide-frame"><div class="slide-background"></div><div class="slide-content" id="slide-content"></div></div><div class="preview-note">背景可使用純色或自行上傳圖片，不包含固定文字；標題與內文字色可在「版面參數」中分別調整。</div></aside>
  </main>
  <aside id="layout-floating-panel" class="layout-floating-panel is-hidden" aria-label="版面參數設定"></aside>
  <dialog id="layout-unlock-dialog" class="layout-unlock-dialog" aria-labelledby="layout-unlock-title">
    <form id="layout-unlock-form">
      <h2 id="layout-unlock-title">解鎖全教會版面配置</h2>
      <p>未解鎖可先儲存本機草稿與測試；解鎖後才會同步全教會共用的版面參數。</p>
      <label>解鎖密碼<input id="layout-unlock-password" type="password" inputmode="numeric" autocomplete="current-password" required></label>
      <p id="layout-unlock-error" class="layout-unlock-error" role="alert"></p>
      <footer><button type="button" class="button quiet" id="layout-unlock-cancel">取消</button><button type="submit" class="button primary">解鎖</button></footer>
    </form>
  </dialog>
  <script src="../../config.js?v=20260918c"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../supabase/supabase-config.js?v=20260917d"></script>
  <script src="worship-ppt-supabase.js?v=20260918c"></script>
  <script src="../LKC_SundayBulletin/js/bulletin-supabase.js?v=20260917d"></script>
  <script src="../../firebase/firebase-config-values.js?v=20260917d"></script>
  <script src="read-api.js?v=20260918d"></script>
  <script src="vendor-jszip.min.js?v=3.10.1"></script>
  <script src="../LKC_ppt_generator/bible-service.js?v=20260917d"></script>
  <script src="calendar-adapter.js?v=20260917d"></script>
  <script src="pptx-library.js?v=20260918a"></script>
  <script src="slide-production.js?v=20260918a"></script>
  <script src="template-profiles.js?v=20260918a"></script>
  <script src="bulletin-content.js?v=20260919a"></script>
  <script src="source-reminders.js?v=20260918a"></script>
    <script src="app.js?v=20260919b"></script>
  <script src="content-generators.js?v=20260918a"></script>
  <script src="ppt-library-integration.js?v=20260918b"></script>
  <script src="calendar-integration.js?v=20260918a"></script>
  <script src="ppt-format-preview.js?v=20260919a"></script>
  <script src="fixed-page-editor.js?v=20260918a"></script>
  <script src="production-editor.js?v=20260918a"></script>
  <script src="bulletin-integration.js?v=20260918a"></script>
  <script src="layout-cloud-store.js?v=20260918a"></script>
    <script src="layout-groups.js?v=20260919c"></script>
  <script src="native-pptx.js?v=20260918a"></script>
  <script src="ppt-export.js?v=20260919b"></script>
  <script>
      const globalHymnOpacitySync = document.getElementById('sync-hymn-opacity-global');
      if (globalHymnOpacitySync) globalHymnOpacitySync.onchange = event => {
        if (window.setHymnOpacitySyncEnabled) window.setHymnOpacitySyncEnabled(event.target.checked);
      };
  </script>
</body>
</html>
