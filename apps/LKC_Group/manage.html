<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小組點名系統 - 後台管理</title>
    <link rel="stylesheet" href="style.css?v=20260928_manage_modal_scroll_v1">
</head>
<body class="page-manage">
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-msg" id="overlay-text">處理中，請稍候...</div>
    </div>
    
    <div class="header">
        <h1 style="color: #c62828; display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 1.2em;">⚙️</span> 系統後台管理
        </h1>
        <a href="index.html" class="btn" style="background: #e0e0e0; color: #333; text-decoration: none;">⬅️ 回首頁</a>
    </div>
    
    <!-- 登入面板 -->
    <div id="login-panel" class="filter-box" style="text-align: center; padding: 40px 20px;">
        <h2>🛡️ 請輸入小組代碼</h2>

        <input type="password" id="adminInput" placeholder="輸入小組代碼" 
               style="font-size: 16px; text-align: center; margin-bottom: 15px; width: 280px;">
        <br>
        <button class="btn" style="background: #c62828; font-size: 16px;" onclick="verifyAdmin()">🔓 登入管理</button>
    </div>
    
    <!-- 管理面板 -->
    <div id="manage-panel" style="display: none;">
        <div class="filter-box" style="background: linear-gradient(145deg, #ffffff, #f5f7f9);">
            <!-- 動態顯示權限等級 -->
            <div id="permission-badge" style="display: inline-block; background: #4CAF50; color: white; padding: 8px 16px; border-radius: 20px; font-weight: bold; margin-bottom: 15px;">
                👤 權限載入中...
            </div>
            
            <h3 id="manage-title" style="margin-top: 0;">📋 小組參數管理</h3>
            <p style="color: #666; font-size: 14px;">修改名稱時，系統將自動同步修改資料庫的關聯分頁名稱，請謹慎操作。</p>

            <!-- 介面切換頁籤 -->
            <div class="tabs-container" style="display: flex; gap: 5px; margin-top: 20px; border-bottom: 2px solid #ddd; padding-bottom: 0;">
                <button id="btn-tab-regular" class="tab-select-btn active" style="padding: 10px 20px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px 8px 0 0;" onclick="switchTab('regular')">⛪ 常規小組管理</button>
                <button id="btn-tab-happy" class="tab-select-btn" style="padding: 10px 20px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px 8px 0 0;" onclick="switchTab('happy')">🍀 幸福小組管理</button>
            </div>
            
            <div style="overflow-x: auto; border-radius: 8px; border: 1px solid #eee;">
                <table id="groupsTable" style="margin-top: 0; border-radius: 0;">
                    <thead>
                        <tr>
                            <th style="width: 20%;">小組名稱</th>
                            <th style="width: 15%;">專屬代碼</th>
                            <th style="width: 10%;">狀態</th>
                            <th style="width: 15%;" class="admin-only-col">所屬牧區</th>
                            <th style="width: 15%;" class="admin-only-col">所屬小組群</th>
                            <th style="width: 15%;" id="dateColumn">建立日期</th>
                            <th style="width: 10%;">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5" style="text-align: center; color: #999;">載入中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 小組長專用：分區小組群管理面板 -->
        <div id="cluster-management-panel" class="filter-box" style="display: none; margin-top: 20px; background: #fffde7; border: 1px solid #fff59d; text-align: left;">
            <h3 style="margin-top: 0; color: #f57f17; border-bottom: 2px solid #fff59d; padding-bottom: 8px;">👥 我管理的小組群成員</h3>
            <p style="color: #666; font-size: 13px;">您可以新增無歸屬的小組至您的小組群，或從群中移除小組（被移除的小組將自動清空其小組群與所屬牧區歸屬）。</p>
            
            <!-- 目前成員名單 -->
            <div style="margin-bottom: 15px;">
                <h4 style="margin: 0 0 8px 0; font-size: 14px; color: #555;">目前旗下小組：</h4>
                <div id="myClusterGroupsList" style="display: flex; flex-wrap: wrap; gap: 10px;">
                    <span style="color:#999; font-size:13px;">載入中...</span>
                </div>
            </div>

            <!-- 新增小組入口 -->
            <div style="border-top: 1px dashed #e0e0e0; padding-top: 15px; display: flex; align-items: center; gap: 10px;">
                <label style="font-weight: bold; font-size: 13px; color: #555;">拉入無歸屬小組：</label>
                <select id="unassignedGroupsSelect" style="padding: 8px; border: 1px solid #ccc; border-radius: 6px; background: white; font-size: 13px;">
                    <option value="">-- 請選擇小組 --</option>
                </select>
                <button class="btn" style="background: #f57f17; padding: 6px 12px; font-size: 13px; color: white;" onclick="addSetupGroupToMyCluster()">➕ 加入我管理的小組群</button>
            </div>
        </div>
    </div>
    
    <!-- 編輯彈窗 -->
    <div id="edit-group-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeEditModal()">&times;</span>
            <h3 style="color: #2196F3;">✏️ 修改小組資訊</h3>
            <p style="color: #e53935; font-size: 12px; font-weight: bold;">⚠️ 若修改名稱，系統會花費幾秒鐘重新命名後端資料庫。</p>
            
            <div style="margin-top: 15px;">
                <label style="font-weight: bold; color: #555;">原始名稱：</label>
                <input type="text" id="editOldName" disabled 
                       style="background: #f5f5f5; width: 100%; margin-top: 5px; color: #999; cursor: not-allowed;">
            </div>
            
            <div style="margin-top: 15px;">
                <label style="font-weight: bold; color: #555;">新名稱：</label>
                <input type="text" id="editNewName" placeholder="請輸入新的小組名稱"
                       style="width: 100%; margin-top: 5px;">
            </div>
            
            <div style="margin-top: 15px;">
                <label style="font-weight: bold; color: #555;">新代碼 (需4碼以上，區分大小寫)：</label>
                <input type="text" id="editNewCode" placeholder="例如：ABC1"
                       style="width: 100%; margin-top: 5px; font-family: monospace;">
            </div>
            
            <div style="margin-top: 15px;">
                <label style="font-weight: bold; color: #555;">狀態設定：</label>
                <select id="editNewStatus" style="width: 100%; margin-top: 5px; padding: 10px; font-size: 14px;">
                    <option value="顯示">✅ 顯示 (在首頁小組清單中顯示)</option>
                    <option value="隱藏">🚫 隱藏 (在首頁小組清單中隱藏)</option>
                </select>
            </div>

            <div style="margin-top: 15px;" class="admin-only-edit-row">
                <label style="font-weight: bold; color: #555;">歸屬牧區：</label>
                <select id="editDistrict" style="width: 100%; margin-top: 5px; padding: 10px; font-size: 14px; background: white;">
                    <option value="">-- 無歸屬 --</option>
                </select>
            </div>
            
            <div style="margin-top: 15px;" class="admin-only-edit-row">
                <label style="font-weight: bold; color: #555;">歸屬小組群：</label>
                <select id="editCluster" style="width: 100%; margin-top: 5px; padding: 10px; font-size: 14px; background: white;">
                    <option value="">-- 無歸屬 --</option>
                </select>
            </div>
            
            <button class="btn" style="background: #4CAF50; width: 100%; margin-top: 25px; font-size: 16px;" 
                    onclick="saveGroupEdit()">💾 儲存修改</button>
        </div>
    </div>
    
    <script>window._GAS_KEY = 'LKC_Group_TEST';</script>
    <script src="../../config.js?v=20260906_v5_history_restored"></script>
    <!-- ⚡ Supabase 本地熱響應服務 (<50ms) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase/supabase-config.js?v=20260906_v5_history_restored"></script>
    <script src="group-supabase.js?v=20260906_v5_history_restored"></script>
    <script src="manage.js?v=20260928_gas_firebase_group_settings_v1"></script>
    <script>
      // 自動在彈出視窗顯示時鎖定底層 body 捲動
      (function() {
        function syncModalScrollLock() {
          var overlays = document.querySelectorAll('.modal, #weeklyModal');
          var anyVisible = false;
          for (var i = 0; i < overlays.length; i++) {
            var el = overlays[i];
            if (el.classList.contains('show') || (el.style && el.style.display !== 'none' && el.style.display !== '')) {
              anyVisible = true;
              break;
            }
          }
          document.body.classList.toggle('modal-open', anyVisible);
        }
        document.addEventListener('show.bs.modal', function() { document.body.classList.add('modal-open'); });
        document.addEventListener('hidden.bs.modal', function() { syncModalScrollLock(); });
        window.syncModalScrollLock = syncModalScrollLock;
      })();
    </script>
</body>
</html>
