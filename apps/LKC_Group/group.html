<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小組點名與進度</title>
    <link rel="stylesheet" href="style.css?v=20260831_v6_data">
    <style>
        /* Sortable.js 拖曳排序樣式 */
        .sortable-ghost { opacity: 0.4; background: #e3f2fd; }
        .sortable-chosen { background: #fff9c4; }
        .drag-handle:hover { color: #555 !important; }
        .drag-handle:active { cursor: grabbing; }
    </style>
    </head>
<body class="page-group">

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-msg" id="overlay-text">處理中，請稍候...</div>
    </div>

    <div class="header" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h2 id="displayGroupName" style="margin: 0; display: inline-block;">載入中...</h2>
            <span id="happyGroupBadge" class="role-badge role-best" style="display: none; margin-left: 8px; vertical-align: middle; width: auto; padding: 2px 8px; border-radius: 4px; font-size: 13px; font-weight: bold; background: #fff3e0; color: #ef6c00;">幸福小組</span>
            <div style="margin-top: 5px;">
                <a href="index.html" style="text-decoration: none; color: #666; font-weight: bold;">⬅️ 返回首頁</a>
            </div>
        </div>  
        <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-end;">
            <div id="scheduleBtn" class="schedule-link-btn" style="display: none;" onclick="goToSchedule()">🗓️ 前往排聚會表</div>
            <button id="concludeBtn" class="btn" style="display: none; background-color: #E91E63; margin-top: 0; padding: 6px 12px; font-size: 13px;" onclick="openConcludeModal()">🍀 結案封存</button>
        </div>
    </div>

    <div id="init-panel" style="display: none; text-align: center; margin-top: 50px;">
        <p>偵測到此小組尚未建立成員名單。</p>
        <button class="btn btn-init" style="background-color: #f44336;" onclick="openInitMemberManager()">🚀 建立成員名單與身分</button>
    </div>

    <div id="attendance-panel" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
            <div style="margin: 15px 0; font-weight: bold; color: #333;">
                📅 聚會日期：<input type="date" id="attendanceDate" style="padding: 5px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <button class="btn" style="background-color: #607D8B; font-size: 14px; margin-bottom: 10px;" onclick="toggleEditMode()">📝 管理名單與身分</button>
        </div>
        
        <div id="memberList" style="border: 1px solid #ddd; border-radius: 8px; overflow: hidden;"></div>

        <div class="new-friend" style="margin-top: 20px; padding: 15px; background: #fff3e0; border-radius: 8px; border: 1px solid #ffe0b2; margin-bottom: 15px;">
            <h4 style="margin-top: 0; color: #e65100;">✨ 新朋友 (若有請輸入，多位請用逗號隔開)</h4>
            <input type="text" id="newFriends" style="width:95%; padding:10px; border: 1px solid #ffcc80; border-radius: 4px;" placeholder="例如：彼得, 約翰">
        </div>

        <button class="btn" style="background-color: #2196F3; width: 100%; font-size: 18px; margin-bottom: 30px;" onclick="submitAttendance()">💾 送出點名</button>

        <div class="progress-section" id="progressSection" style="display: none;">
            <div class="progress-header">
                <h3>📊 近期聚會紀錄 <span style="font-size: 13px; color: #666;">(最近3次)</span></h3>
                <button class="btn" style="background-color: #9C27B0; padding: 6px 12px; margin: 0; font-size: 13px;" onclick="goToFullStats()">📈 完整統計中心</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 25%;">日期</th>
                            <th style="width: 20%;">實到</th>
                            <th style="width: 55%; text-align: left;">出席摘要</th>
                        </tr>
                    </thead>
                    <tbody id="progressTableBody">
                        <tr><td colspan="3" style="color: #666;">資料載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3 id="editModalTitle" style="margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; color: #333;">📝 管理名單與身分</h3>
            
            <div class="edit-add-box">
                <input type="text" id="newMemberInput"
                       list="memberSuggestionsList"
                       autocomplete="off"
                       placeholder="輸入姓名（會自動下拉會友清單，找不到也可直接輸入新人）"
                       onkeypress="if(event.key==='Enter') addEditMember()">
                <datalist id="memberSuggestionsList"></datalist>
                <select id="newMemberRole" class="edit-role-select">
                    <option value="小羊">小羊</option>
                    <option value="一般同工">一般同工</option>
                    <option value="核心同工">核心同工</option>
                    <option value="陪伴同工">陪伴同工</option>
                </select>
                <button class="btn-add" onclick="addEditMember()">➕ 新增</button>
            </div>

            <div class="edit-list-container" id="editMemberList"></div>

            <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 20px;">
                <button class="btn" onclick="toggleEditMode()" style="background: #9e9e9e; margin-top: 0;">取消</button>
                <button id="saveMemberListBtn" class="btn" onclick="saveUpdatedList()" style="background: #4CAF50; margin-top: 0;">💾 儲存變更</button>
            </div>
        </div>
    </div>

    <div id="edit-attendance-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; color: #333;">✏️ 修改點名紀錄</h3>
            
            <input type="hidden" id="editOriginalDate">
            
            <div style="margin: 15px 0; font-weight: bold; color: #333;">
                📅 聚會日期：<input type="date" id="editAttendanceDate" style="padding: 5px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            


            <div id="editAttendanceMemberList" style="border: 1px solid #ddd; border-radius: 8px; overflow-y: auto; flex: 1; min-height: 100px;">
                </div>

            <div class="new-friend" style="margin-top: 15px;">
                <h4 style="margin-top: 0; color: #e65100;">✨ 新朋友</h4>
                <input type="text" id="editNewFriends" style="width:95%; padding:10px; border: 1px solid #ffcc80; border-radius: 4px;">
            </div>
            <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 20px;">
                <button class="btn" onclick="closeEditAttendanceModal()" style="background: #9e9e9e; padding: 10px; margin-top: 0;">取消</button>
                <button class="btn" onclick="deleteAttendanceRecord()" style="background: #f44336; padding: 10px; margin-top: 0;">🗑️ 刪除紀錄</button>
                <button class="btn" onclick="submitAttendanceEdit()" style="background: #4CAF50; padding: 10px; margin-top: 0;">💾 儲存修改</button>
            </div>
        </div>
    </div>

    <!-- 結案封存彈窗 -->
    <div id="concludeModal" class="modal">
        <div class="modal-content" style="max-width: 500px; width: 90%;">
            <span class="close-btn" onclick="toggleConcludeModal(false)">&times;</span>
            <h3 style="color: #E91E63; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; display: flex; align-items: center; gap: 8px;">🍀 幸福小組結案封存</h3>
            
            <p style="font-size: 13px; color: #666; text-align: left; margin-bottom: 15px;">
                結案後，本組同工出席紀錄將同步寫回其所屬常規小組。請勾選需要<strong>升級為正式會友</strong>的 BEST：
            </p>

            <div id="concludeBestList" style="border: 1px solid #ddd; border-radius: 8px; flex: 1; min-height: 100px; overflow-y: auto; margin-bottom: 20px; text-align: left; background: #fafafa; padding: 10px; box-sizing: border-box;">
                <!-- BEST 成員列表與指派下拉選單會生成在這裡 -->
            </div>

            <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 20px;">
                <button class="btn" onclick="toggleConcludeModal(false)" style="background: #9e9e9e; margin-top: 0;">取消</button>
                <button class="btn" onclick="submitHappyConclude()" style="background: #E91E63; margin-top: 0;">💾 確認結案</button>
            </div>
        </div>
    </div>

    <script>window._GAS_KEY = 'LKC_Group_TEST';</script>
    <script src="../../config.js?v=20260906_v5_history_restored"></script>
    <!-- ⚡ Supabase 本地熱響應服務 (<50ms) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase/supabase-config.js?v=20260906_v5_history_restored"></script>
    <script src="../LKC_SundayserviceAttendance/attendance-supabase.js?v=20260922_single_source"></script>
    <script src="group-supabase.js?v=20260906_v5_history_restored"></script>
    <!-- 拖曳排序庫 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="group.js?v=20260906_v5_history_restored"></script>
    <script>
      // 自動在彈出視窗顯示時鎖定底層 body 捲動
      (function() {
        function syncModalScrollLock() {
          var overlays = document.querySelectorAll('.modal, #weeklyModal');
          var anyVisible = false;
          for (var i = 0; i < overlays.length; i++) {
            var el = overlays[i];
            if (el.classList.contains('show') || (el.style && el.style.display !== 'none' && el.style.display !== '')) {
              anyVisible = true;
              break;
            }
          }
          document.body.classList.toggle('modal-open', anyVisible);
        }
        document.addEventListener('show.bs.modal', function() { document.body.classList.add('modal-open'); });
        document.addEventListener('hidden.bs.modal', function() { syncModalScrollLock(); });
        window.syncModalScrollLock = syncModalScrollLock;
      })();
    </script>
</body>
</html>
