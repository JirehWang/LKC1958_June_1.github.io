name: Keep Supabase Active

on:
  schedule:
    # 每週一與週四 04:00 UTC (台灣時間中午 12:00) 自動執行一次
    - cron: '0 4 * * 1,4'
  workflow_dispatch: # 支援在 GitHub 介面手動點擊觸發

concurrency:
  group: keep-supabase-warm
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API with retries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          SUPABASE_URL="https://ioxlptzwpmczsxboggct.supabase.co"
          SUPABASE_KEY="sb_publishable_By6SrH7lHFwdOCgw8srvUg_swLAM3cz"
          MAX_ATTEMPTS=3
          RETRY_DELAY_SECONDS=60
          NEXT_CYCLE_DELAY_SECONDS=$((4 * 60 * 60))
          PING_URL="${SUPABASE_URL}/rest/v1/worship_positions?select=id&limit=1"

          echo "Starting Supabase keep-warm cycle (up to ${MAX_ATTEMPTS} attempts)..."
          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: pinging Supabase REST API..."
            if ! STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 20 \
              --max-time 60 \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              "${PING_URL}")"; then
              STATUS="000"
            fi

            echo "Supabase Response HTTP Status: ${STATUS}"
            if [[ "${STATUS}" =~ ^2[0-9]{2}$ ]]; then
              echo "✅ Supabase is active and healthy!"
              exit 0
            fi

            if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
              echo "⚠️ Attempt ${attempt} failed; retrying in ${RETRY_DELAY_SECONDS} seconds..."
              sleep "${RETRY_DELAY_SECONDS}"
            fi
          done

          echo "⚠️ All ${MAX_ATTEMPTS} Supabase ping attempts failed."
          echo "Waiting 4 hours before dispatching the next retry cycle..."
          sleep "${NEXT_CYCLE_DELAY_SECONDS}"

          echo "Dispatching the next keep-warm retry cycle..."
          if ! curl --silent --show-error --fail-with-body --output /dev/null \
            --request POST \
            --connect-timeout 20 \
            --max-time 60 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/keep-supabase-warm.yml/dispatches" \
            --data "{\"ref\":\"${GITHUB_REF_NAME}\"}"; then
            echo "❌ Failed to dispatch the next retry cycle."
            exit 1
          fi

          echo "✅ Next retry cycle dispatched; this run remains failed so the original outage is visible."
          exit 1
